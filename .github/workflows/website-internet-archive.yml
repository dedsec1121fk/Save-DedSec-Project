name: Archive DedSec Website

on:
  push:
  workflow_dispatch:
    inputs:
      full_archive:
        description: Archive every public website file, not only changed files
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 03 * * 0"

permissions:
  contents: read

concurrency:
  group: dedsec-website-internet-archive
  cancel-in-progress: false

env:
  SITE_URL: https://ded-sec.space
  IA_ITEM_IDENTIFIER: dedsec1121fk-dedsec-website-snapshots

jobs:
  archive:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}

    steps:
      - name: Check out website repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so we can push later

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate Internet Archive credentials
        shell: bash
        run: |
          if [[ -z "${IA_ACCESS_KEY:-}" || -z "${IA_SECRET_KEY:-}" ]]; then
            echo "::error::Add Internet_Archive_1 (access key) and Internet_Archive_2 (secret key) in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create complete website source snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-output

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          snapshot="dedsec-website-${timestamp}-${short_sha}.zip"
          manifest="dedsec-website-${timestamp}-${short_sha}-manifest.json"

          git archive --format=zip --output="archive-output/${snapshot}" HEAD

          SNAPSHOT="${snapshot}" MANIFEST="${manifest}" TIMESTAMP="${timestamp}" python <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          output = pathlib.Path("archive-output")
          snapshot = output / os.environ["SNAPSHOT"]
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          tracked = [p.decode("utf-8", "surrogateescape") for p in tracked if p]

          digest = hashlib.sha256(snapshot.read_bytes()).hexdigest()
          manifest = {
              "archive_type": "DedSec Project website source snapshot",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "created_utc": os.environ["TIMESTAMP"],
              "website": os.environ["SITE_URL"],
              "snapshot_file": snapshot.name,
              "snapshot_sha256": digest,
              "tracked_file_count": len(tracked),
              "tracked_files": tracked,
          }
          (output / os.environ["MANIFEST"]).write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          (output / f"{snapshot.name}.sha256").write_text(
              f"{digest}  {snapshot.name}\n", encoding="ascii"
          )
          PY

          echo "snapshot=${snapshot}" >> "$GITHUB_OUTPUT"
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Upload complete snapshot to Internet Archive
        shell: bash
        run: |
          set -euo pipefail

          upload_to_ia() {
            local file="$1"
            local remote_name
            remote_name="$(basename "$file")"

            curl --silent --show-error --fail-with-body --location \
              --retry 6 --retry-all-errors --retry-delay 10 \
              --header "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
              --header "x-amz-auto-make-bucket:1" \
              --header "x-archive-ignore-preexisting-bucket:1" \
              --header "x-archive-queue-derive:0" \
              --header "x-archive-meta-title:DedSec Project Website Source Snapshots" \
              --header "x-archive-meta-creator:DedSec Project" \
              --header "x-archive-meta-mediatype:software" \
              --header "x-archive-meta-description:Complete versioned source snapshots of the public DedSec Project website at https://ded-sec.space/." \
              --header "x-archive-meta-subject:DedSec Project; website; source code; cybersecurity education" \
              --upload-file "$file" \
              "https://s3.us.archive.org/${IA_ITEM_IDENTIFIER}/${remote_name}"
          }

          upload_to_ia "archive-output/${{ steps.snapshot.outputs.snapshot }}"
          upload_to_ia "archive-output/${{ steps.snapshot.outputs.snapshot }}.sha256"
          upload_to_ia "archive-output/${{ steps.snapshot.outputs.manifest }}"

          echo "Internet Archive item: https://archive.org/details/${IA_ITEM_IDENTIFIER}"

      - name: Build Wayback Machine URL list
        id: urls
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FULL_INPUT: ${{ inputs.full_archive || 'false' }}
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import pathlib
          import subprocess
          import urllib.parse

          event = os.environ.get("EVENT_NAME", "")
          before = os.environ.get("BEFORE_SHA", "")
          full_input = os.environ.get("FULL_INPUT", "false").lower() == "true"
          site = os.environ["SITE_URL"].rstrip("/")

          def tracked_files():
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]

          full = event == "schedule" or full_input
          if event == "push" and (not before or set(before) == {"0"}):
              full = True

          if full:
              paths = tracked_files()
          else:
              try:
                  raw = subprocess.check_output(
                      ["git", "diff", "--name-only", "-z", before, "HEAD"]
                  )
                  paths = [
                      p.decode("utf-8", "surrogateescape")
                      for p in raw.split(b"\0")
                      if p
                  ]
              except subprocess.CalledProcessError:
                  paths = tracked_files()

          excluded_prefixes = (".git/", ".github/")
          excluded_names = {
              ".gitignore", ".gitattributes", ".nojekyll",
              "README", "README.md", "README.txt",
              "LICENSE", "LICENSE.md", "SECURITY.md",
          }

          urls = {site + "/"}
          for path in paths:
              normalized = path.replace("\\", "/").lstrip("/")
              if not normalized or normalized.startswith(excluded_prefixes):
                  continue
              if normalized in excluded_names or "/." in normalized:
                  continue
              local = pathlib.Path(path)
              if not local.is_file():
                  continue

              encoded = urllib.parse.quote(normalized, safe="/~._-()")
              urls.add(f"{site}/{encoded}")

              lower = normalized.lower()
              if lower == "index.html":
                  urls.add(site + "/")
              elif lower.endswith("/index.html"):
                  directory = encoded[: -len("index.html")]
                  urls.add(f"{site}/{directory}")

          pathlib.Path("wayback-urls.txt").write_text(
              "\n".join(sorted(urls)) + "\n", encoding="utf-8"
          )
          print(f"Prepared {len(urls)} URL(s) for Wayback Machine submission.")
          PY

          echo "count=$(wc -l < wayback-urls.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Submit website files to Wayback Machine
        if: steps.urls.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          access = os.environ["IA_ACCESS_KEY"]
          secret = os.environ["IA_SECRET_KEY"]
          urls = [
              line.strip()
              for line in pathlib.Path("wayback-urls.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          accepted = []
          failures = []

          for number, url in enumerate(urls, start=1):
              payload = urllib.parse.urlencode({
                  "url": url,
                  "capture_outlinks": "0",
                  "capture_screenshot": "0",
                  "skip_first_archive": "1",
              }).encode("utf-8")

              last_error = "unknown error"
              for attempt in range(1, 7):
                  request = urllib.request.Request(
                      "https://web.archive.org/save",
                      data=payload,
                      method="POST",
                      headers={
                          "Authorization": f"LOW {access}:{secret}",
                          "Accept": "application/json",
                          "User-Agent": "DedSec-Project-GitHub-Archiver/1.0",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          body = response.read().decode("utf-8", "replace")
                          data = json.loads(body) if body.lstrip().startswith("{") else {"response": body}
                          accepted.append({"url": url, "status": response.status, "result": data})
                          print(f"[{number}/{len(urls)}] accepted: {url}")
                          break
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")
                      last_error = f"HTTP {exc.code}: {body[:500]}"
                      if exc.code not in {429, 500, 502, 503, 504}:
                          break
                      retry_after = exc.headers.get("Retry-After")
                      delay = int(retry_after) if retry_after and retry_after.isdigit() else min(120, 10 * attempt)
                      print(f"[{number}/{len(urls)}] retry {attempt}/6 in {delay}s: {url}")
                      time.sleep(delay)
                  except Exception as exc:
                      last_error = repr(exc)
                      delay = min(120, 10 * attempt)
                      print(f"[{number}/{len(urls)}] retry {attempt}/6 in {delay}s: {url}")
                      time.sleep(delay)
              else:
                  pass

              if not accepted or accepted[-1]["url"] != url:
                  failures.append({"url": url, "error": last_error})
                  print(f"::warning title=Wayback capture failed::{url} — {last_error}")

              time.sleep(3 + random.random() * 2)

          report = {
              "submitted_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "requested": len(urls),
              "accepted": len(accepted),
              "failed": len(failures),
              "accepted_requests": accepted,
              "failures": failures,
          }
          pathlib.Path("wayback-report.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print(f"Wayback requests accepted: {len(accepted)}/{len(urls)}")
          if urls and not accepted:
              raise SystemExit("Every Wayback Machine submission failed.")
          PY

      - name: Upload Wayback submission report to Internet Archive
        if: always() && hashFiles('wayback-report.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          report_name="dedsec-website-${{ steps.snapshot.outputs.timestamp }}-${GITHUB_SHA::12}-wayback-report.json"
          cp wayback-report.json "$report_name"

          curl --silent --show-error --fail-with-body --location \
            --retry 6 --retry-all-errors --retry-delay 10 \
            --header "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
            --header "x-amz-auto-make-bucket:1" \
            --header "x-archive-ignore-preexisting-bucket:1" \
            --header "x-archive-queue-derive:0" \
            --upload-file "$report_name" \
            "https://s3.us.archive.org/${IA_ITEM_IDENTIFIER}/${report_name}"
