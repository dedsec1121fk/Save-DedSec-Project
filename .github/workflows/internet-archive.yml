name: Incrementally Archive Entire DedSec Ecosystem

on:
  schedule:
    # Core DedSec repositories + websites — Greece local time.
    - cron: "11 11 * * 1"
      timezone: "Europe/Athens"
    - cron: "22 22 * * 3"
      timezone: "Europe/Athens"
    - cron: "0 0 * * 6"
      timezone: "Europe/Athens"

    # Other projects — Greece local time.
    - cron: "5 5 * * 2"
      timezone: "Europe/Athens"
    - cron: "12 12 * * 5"
      timezone: "Europe/Athens"

    # GitHub cron cannot express 1st/3rd vs 2nd/4th Sunday directly.
    # Both Sunday triggers start the lightweight prepare job; the plan below
    # runs 03:33 only on the 1st/3rd Sunday and 03:00 only on the 2nd/4th.
    # A 5th Sunday is intentionally skipped.
    - cron: "33 3 * * 0"
      timezone: "Europe/Athens"
    - cron: "0 3 * * 0"
      timezone: "Europe/Athens"

  workflow_dispatch:
    inputs:
      group:
        description: Archive group to run
        required: true
        default: all
        type: choice
        options:
          - all
          - dedsec-project
          - websites
          - other-projects

permissions:
  contents: write

concurrency:
  # One global lock for the Internet Archive account. Manual and scheduled
  # runs can no longer overlap and compete for the same remote rate limits.
  group: dedsec-incremental-archive
  cancel-in-progress: false

jobs:
  prepare:
    name: Select archive targets
    runs-on: ubuntu-latest

    outputs:
      target_count: ${{ steps.plan.outputs.target_count }}
      target_matrix: ${{ steps.plan.outputs.target_matrix }}
      selected_targets: ${{ steps.plan.outputs.selected_targets }}
      all_targets: ${{ steps.plan.outputs.all_targets }}
      group_name: ${{ steps.plan.outputs.group_name }}

    steps:
      - name: Build archive plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          dedsec_targets = [
              {
                  "repository": "dedsec1121fk/DedSec",
                  "slug": "dedsec-main",
                  "title": "DedSec Project Main Repository",
                  "archive_label": "DedSec main",
                  "marker": "DEDSEC_MAIN_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-project-repository-snapshots",
                  "timeout_minutes": 300,
                  "window": "Monday 11:11, Wednesday 22:22 and Saturday 00:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": (
                      "dedsec-main-,"
                      "dedsec-project-repositories-,"
                      "dedsec-main-project-,"
                      "dedsec-backup-,"
                      "dedsec-backup-project-,"
                      "dedsec-complete-archive-"
                  ),
              },
              {
                  "repository": "sal-scar/DedSec",
                  "slug": "dedsec-backup",
                  "title": "DedSec Project Backup Repository",
                  "archive_label": "DedSec backup",
                  "marker": "DEDSEC_BACKUP_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-project-backup-repository-snapshots",
                  "timeout_minutes": 300,
                  "window": "Monday 11:11, Wednesday 22:22 and Saturday 00:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": (
                      "dedsec-backup-,"
                      "dedsec-backup-project-"
                  ),
              },
          ]

          website_targets = [
              {
                  "repository": "dedsec1121fk/dedsec1121fk.github.io",
                  "slug": "dedsec-websites",
                  "title": "DedSec Websites and Website Source",
                  "archive_label": "Websites",
                  "marker": "WEBSITES_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-website-snapshots",
                  "timeout_minutes": 300,
                  "window": "Monday 11:11, Wednesday 22:22 and Saturday 00:00 Europe/Athens",
                  "kind": "website",
                  "sites": "https://ded-sec.space|https://ded-sec.online",
                  "legacy_prefixes": (
                      "dedsec-websites-,"
                      "dedsec-website-source-,"
                      "dedsec-website-history-,"
                      "dedsec-complete-archive-"
                  ),
              },
          ]

          website_mirror_targets = [
              {
                  "repository": "sal-scar/ded-sec",
                  "slug": "dedsec-website-mirror",
                  "title": "DedSec Website Mirror Repository",
                  "archive_label": "Website mirror",
                  "marker": "DEDSEC_WEBSITE_MIRROR_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-website-mirror-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Monday 11:11, Wednesday 22:22 and Saturday 00:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "dedsec-website-mirror-,ded-sec-mirror-",
              },
          ]

          other_targets = [
              {
                  "repository": "dedsec1121fk/dedsec1121fk",
                  "slug": "github-profile",
                  "title": "DedSec GitHub Profile Repository",
                  "archive_label": "GitHub profile",
                  "marker": "GITHUB_PROFILE_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-github-profile-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Tuesday 05:05, Friday 12:12, 1st/3rd Sunday 03:33 and 2nd/4th Sunday 03:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "github-profile-",
              },
              {
                  "repository": "dedsec1121fk/Corrupted-Files-Project",
                  "slug": "corrupted-files-project",
                  "title": "Corrupted Files Project",
                  "archive_label": "Corrupted Files",
                  "marker": "CORRUPTED_FILES_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-corrupted-files-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Tuesday 05:05, Friday 12:12, 1st/3rd Sunday 03:33 and 2nd/4th Sunday 03:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "corrupted-files-project-",
              },
              {
                  "repository": "dedsec1121fk/Pocket-AI-Project",
                  "slug": "pocket-ai",
                  "title": "Pocket AI",
                  "archive_label": "Pocket AI",
                  "marker": "POCKET_AI_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-pocket-ai-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Tuesday 05:05, Friday 12:12, 1st/3rd Sunday 03:33 and 2nd/4th Sunday 03:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "pocket-ai-",
              },
              {
                  "repository": "dedsec1121fk/Praying-Project",
                  "slug": "praying-project",
                  "title": "Praying Project",
                  "archive_label": "Praying Project",
                  "marker": "PRAYING_PROJECT_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-praying-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Tuesday 05:05, Friday 12:12, 1st/3rd Sunday 03:33 and 2nd/4th Sunday 03:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "praying-project-",
              },
              {
                  "repository": "dedsec1121fk/Offline-Survival-Project",
                  "slug": "offline-survival-project",
                  "title": "Offline Survival Project",
                  "archive_label": "Offline Survival",
                  "marker": "OFFLINE_SURVIVAL_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-offline-survival-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Tuesday 05:05, Friday 12:12, 1st/3rd Sunday 03:33 and 2nd/4th Sunday 03:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "offline-survival-project-",
              },
              {
                  "repository": "dedsec1121fk/Hacking-Guide-Project",
                  "slug": "hacking-guide-project",
                  "title": "Hacking Guide Project",
                  "archive_label": "Hacking Guide Project",
                  "marker": "HACKING_GUIDE_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-hacking-guide-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Tuesday 05:05, Friday 12:12, 1st/3rd Sunday 03:33 and 2nd/4th Sunday 03:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "hacking-guide-project-,hacking-guide-",
              },
              {
                  "repository": "dedsec1121fk/Language-Project",
                  "slug": "language-project",
                  "title": "Language Project",
                  "archive_label": "Language Project",
                  "marker": "LANGUAGE_PROJECT_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-language-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Tuesday 05:05, Friday 12:12, 1st/3rd Sunday 03:33 and 2nd/4th Sunday 03:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "language-project-",
              },
              {
                  "repository": "dedsec1121fk/Save-DedSec-Project",
                  "slug": "save-dedsec-project",
                  "title": "Save DedSec Project",
                  "archive_label": "Save DedSec Project",
                  "marker": "SAVE_DEDSEC_PROJECT_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-save-dedsec-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Tuesday 05:05, Friday 12:12, 1st/3rd Sunday 03:33 and 2nd/4th Sunday 03:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "save-dedsec-project-",
              },
          ]

          all_targets = dedsec_targets + website_targets + website_mirror_targets + other_targets

          event_name = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          manual_group = os.environ.get("MANUAL_GROUP", "") or "all"
          athens_now = datetime.now(ZoneInfo("Europe/Athens"))

          if event_name == "workflow_dispatch":
              group_name = manual_group
              if manual_group == "all":
                  targets = all_targets
              elif manual_group == "dedsec-project":
                  targets = dedsec_targets
              elif manual_group == "websites":
                  targets = website_targets + website_mirror_targets
              elif manual_group == "other-projects":
                  targets = other_targets
              else:
                  raise SystemExit(f"Unknown manual group: {manual_group}")

          elif schedule in {
              "11 11 * * 1",
              "22 22 * * 3",
              "0 0 * * 6",
          }:
              group_name = "dedsec-project-and-websites"
              targets = dedsec_targets + website_targets + website_mirror_targets

          elif schedule in {
              "5 5 * * 2",
              "12 12 * * 5",
          }:
              group_name = "other-projects"
              targets = other_targets

          elif schedule in {"33 3 * * 0", "0 3 * * 0"}:
              # A cron expression cannot directly say 1st/3rd or 2nd/4th
              # Sunday. Determine the Sunday ordinal in Europe/Athens and
              # run only the matching trigger. A fifth Sunday is skipped.
              sunday_number = ((athens_now.day - 1) // 7) + 1
              should_run = (
                  schedule == "33 3 * * 0" and sunday_number in {1, 3}
              ) or (
                  schedule == "0 3 * * 0" and sunday_number in {2, 4}
              )

              if should_run:
                  group_name = "other-projects"
                  targets = other_targets
              else:
                  group_name = "other-projects-sunday-skip"
                  targets = []

          else:
              raise SystemExit(
                  f"Unrecognized trigger: event={event_name!r}, "
                  f"schedule={schedule!r}"
              )

          # Scheduled runs deliberately rotate target priority across the year.
          # Odd-numbered months (Jan, Mar, May, Jul, Sep, Nov) use the target
          # lists exactly as defined above. Even-numbered months (Feb, Apr,
          # Jun, Aug, Oct, Dec) reverse the selected list. Combined with
          # max-parallel: 1 below, this makes the order deterministic and gives
          # both ends of each target list equal first-run priority over 12 months.
          # Manual workflow_dispatch runs always keep the listed order.
          order_mode = "listed"
          if event_name == "schedule" and targets and athens_now.month % 2 == 0:
              targets = list(reversed(targets))
              order_mode = "reverse"

          matrix = {"include": targets}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"target_count={len(targets)}\n")
              output.write(
                  "target_matrix="
                  + json.dumps(matrix, separators=(",", ":"))
                  + "\n"
              )
              output.write(
                  "selected_targets="
                  + json.dumps(targets, separators=(",", ":"))
                  + "\n"
              )
              output.write(
                  "all_targets="
                  + json.dumps(all_targets, separators=(",", ":"))
                  + "\n"
              )
              output.write(f"group_name={group_name}\n")

          print(
              f"Selected {len(targets)} targets for group {group_name!r}; "
              f"order={order_mode}, Greece month={athens_now.month}."
          )
          PY

  sync-targets:
    name: Mirror ${{ matrix.title }}
    needs: prepare
    if: needs.prepare.outputs.target_count != '0'
    # MAINTENANCE: Keep this on the standard ubuntu-latest runner.
    # Do not replace it with a GitHub larger-runner label without reviewing billing.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}

    strategy:
      fail-fast: false
      # Keep target processing serial so the configured monthly order is real.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.target_matrix) }}

    env:
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_SLUG: ${{ matrix.slug }}
      TARGET_TITLE: ${{ matrix.title }}
      TARGET_MARKER: ${{ matrix.marker }}
      TARGET_KIND: ${{ matrix.kind }}
      TARGET_SITES: ${{ matrix.sites }}
      TARGET_WINDOW: ${{ matrix.window }}
      IA_ITEM_IDENTIFIER: ${{ matrix.ia_item }}
      LEGACY_PREFIXES: ${{ matrix.legacy_prefixes }}
      TARGET_COUNT: ${{ needs.prepare.outputs.target_count }}

      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}

    steps:
      - name: Check out archive controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 1

      - name: Check out target repository working tree only
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: source
          fetch-depth: 1
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Validate Internet Archive secrets
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${IA_ACCESS_KEY:-}" ]] || {
            echo "::error::Missing Internet_Archive_1."
            exit 1
          }

          [[ -n "${IA_SECRET_KEY:-}" ]] || {
            echo "::error::Missing Internet_Archive_2."
            exit 1
          }

          if [[ "$IA_ACCESS_KEY" =~ [[:space:]] || "$IA_SECRET_KEY" =~ [[:space:]] ]]; then
            echo "::error::An Internet Archive secret contains whitespace."
            exit 1
          fi

          echo "::add-mask::$IA_ACCESS_KEY"
          echo "::add-mask::$IA_SECRET_KEY"

      - name: Cool down before Internet Archive requests
        shell: bash
        run: |
          set -euo pipefail

          delay="$(
            TARGET_SLUG="$TARGET_SLUG" python3 - <<'PY'
          import hashlib
          import os

          slug = os.environ["TARGET_SLUG"]
          seed = int(hashlib.sha256(slug.encode()).hexdigest()[:8], 16)
          # 45-74 seconds of deterministic spacing between serial target jobs.
          print(45 + (seed % 30))
          PY
          )"

          echo "Cooling down ${delay}s before this target touches Internet Archive."
          sleep "$delay"

      - name: Synchronize compact working-tree archive
        id: sync
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import random
          import stat
          import subprocess
          import tarfile
          import time
          import traceback
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          SCHEMA_VERSION = 7
          ARCHIVE_MODE = "single_current_working_tree_archive"
          SOURCE_ROOT = pathlib.Path("source")
          CONTROLLER_STATE_PATH = pathlib.Path("controller") / "update.json"
          LOCAL_STATE_DIR = pathlib.Path("archive-state")
          LOCAL_STATE_DIR.mkdir(parents=True, exist_ok=True)
          LOCAL_STATE_PATH = LOCAL_STATE_DIR / f"{os.environ['TARGET_SLUG']}.json"

          ARCHIVE_NAME = "current-working-tree.tar.gz"
          MANIFEST_NAME = "manifest.json"
          CHECKSUM_NAME = "SHA256SUMS.txt"
          IA_STATE_NAME = "archive-state/update.json"

          REPOSITORY = os.environ["TARGET_REPOSITORY"]
          SLUG = os.environ["TARGET_SLUG"]
          TITLE = os.environ["TARGET_TITLE"]
          MARKER = os.environ["TARGET_MARKER"]
          KIND = os.environ["TARGET_KIND"]
          SITES = [
              item.strip().rstrip("/")
              for item in os.environ.get("TARGET_SITES", "").split("|")
              if item.strip()
          ]
          WINDOW = os.environ["TARGET_WINDOW"]
          ITEM = os.environ["IA_ITEM_IDENTIFIER"]
          ACCESS_KEY = os.environ["IA_ACCESS_KEY"]
          SECRET_KEY = os.environ["IA_SECRET_KEY"]
          RUN_ID = os.environ["RUN_ID"]
          RUN_ATTEMPT = os.environ["RUN_ATTEMPT"]
          LEGACY_PREFIXES = tuple(
              prefix.strip()
              for prefix in os.environ.get("LEGACY_PREFIXES", "").split(",")
              if prefix.strip()
          )

          RETRYABLE_HTTP = {408, 425, 429, 500, 502, 503, 504}

          def utc_now() -> str:
              return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def greece_now() -> str:
              return datetime.now(ZoneInfo("Europe/Athens")).strftime(
                  "%Y-%m-%d %H:%M:%S %Z"
              )

          def redact_sensitive(value: object) -> str:
              text = str(value)
              for secret_value in (ACCESS_KEY, SECRET_KEY):
                  if secret_value:
                      text = text.replace(secret_value, "[REDACTED]")
              return text

          def delay_for(attempt: int, retry_after: str | None = None) -> int:
              if retry_after and retry_after.isdigit():
                  return min(1800, max(1, int(retry_after)))
              return min(600, 20 * (2 ** min(attempt - 1, 5)))

          def sha256_file(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def remote_url(host: str, remote_name: str) -> str:
              return (
                  host.rstrip("/")
                  + "/"
                  + urllib.parse.quote(ITEM, safe="")
                  + "/"
                  + urllib.parse.quote(remote_name, safe="/~._-()")
              )

          def get_json_with_retry(
              url_factory,
              *,
              label: str,
              not_found,
              attempts: int = 8,
              tolerate_unavailable: bool = False,
          ):
              last_error: BaseException | None = None
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url_factory(),
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": "DedSec-Archive-Sync/7.0",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=120) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return not_found
                      last_error = error
                      if error.code not in RETRYABLE_HTTP:
                          if tolerate_unavailable:
                              break
                          raise
                      wait = delay_for(attempt, error.headers.get("Retry-After"))
                      print(f"{label}: HTTP {error.code}; retry in {wait}s.")
                      time.sleep(wait)
                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      json.JSONDecodeError,
                      UnicodeDecodeError,
                  ) as error:
                      last_error = error
                      wait = delay_for(attempt)
                      print(f"{label}: temporary error; retry in {wait}s.")
                      time.sleep(wait)

              if tolerate_unavailable:
                  print(
                      f"::warning title={label} unavailable::"
                      f"Continuing safely without it: {last_error!r}"
                  )
                  return not_found
              raise RuntimeError(f"{label} unavailable: {last_error!r}")

          def check_s3_capacity() -> tuple[bool, str]:
              query = urllib.parse.urlencode({
                  "check_limit": "1",
                  "accesskey": ACCESS_KEY,
                  "bucket": ITEM,
              })
              request = urllib.request.Request(
                  f"https://s3.us.archive.org/?{query}",
                  headers={"User-Agent": "DedSec-Archive-Sync/7.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = json.load(response)
                  over_limit = str(payload.get("over_limit", "0")) == "1"
                  return (not over_limit), str(payload.get("detail", ""))
              except Exception as error:
                  # Unknown capacity is treated conservatively. It is safer to
                  # defer one archive run than to guess and trigger 429/SlowDown.
                  return False, f"capacity check unavailable: {error!r}"

          def wait_for_s3_capacity(max_waits: int = 6) -> None:
              for attempt in range(1, max_waits + 1):
                  ready, detail = check_s3_capacity()
                  if ready:
                      return
                  wait = min(180, 20 + (attempt * 10))
                  print(
                      f"Internet Archive queue is over limit; waiting {wait}s "
                      f"before request ({attempt}/{max_waits}). {detail[:300]}"
                  )
                  time.sleep(wait)
              raise RuntimeError(
                  "Internet Archive capacity remained unavailable/over-limit; "
                  "upload deferred instead of forcing a request."
              )

          def run_curl(arguments: list[str]) -> None:
              subprocess.run(
                  [
                      "curl",
                      "--silent",
                      "--show-error",
                      "--fail-with-body",
                      "--location",
                      "--location-trusted",
                      "--retry",
                      "8",
                      "--retry-connrefused",
                      "--retry-delay",
                      "0",
                      "--retry-max-time",
                      "3600",
                      "--connect-timeout",
                      "45",
                      *arguments,
                  ],
                  check=True,
              )

          def upload_file(
              local_path: pathlib.Path,
              remote_name: str,
              *,
              include_item_metadata: bool = False,
          ) -> None:
              wait_for_s3_capacity()
              headers = [
                  "--header", f"Authorization: LOW {ACCESS_KEY}:{SECRET_KEY}",
                  "--header", "x-amz-auto-make-bucket:1",
                  "--header", "x-archive-ignore-preexisting-bucket:1",
                  # Critical privacy behavior: replacing the current archive or
                  # state must not create history/files/* backup copies.
                  "--header", "x-archive-keep-old-version:0",
                  "--header", "x-archive-queue-derive:0",
              ]
              if include_item_metadata:
                  headers.extend([
                      "--header", f"x-archive-meta-title:{TITLE}",
                      "--header", "x-archive-meta-creator:DedSec Project",
                      "--header", "x-archive-meta-mediatype:software",
                      "--header",
                      (
                          "x-archive-meta-description:Current working-tree-only "
                          f"archive for {REPOSITORY}. Git history is intentionally excluded."
                      ),
                      "--header",
                      (
                          "x-archive-meta-subject:DedSec Project; source code; "
                          "working tree; software preservation"
                      ),
                  ])
              run_curl([
                  *headers,
                  "--upload-file", str(local_path),
                  remote_url("https://s3.us.archive.org", remote_name),
              ])
              # One successful PUT at a time, with breathing room before the
              # next capacity probe/write on the same Internet Archive account.
              time.sleep(30)

          def delete_remote(remote_name: str) -> None:
              wait_for_s3_capacity()
              result = subprocess.run(
                  [
                      "curl",
                      "--silent",
                      "--show-error",
                      "--location",
                      "--location-trusted",
                      "--request", "DELETE",
                      "--retry", "8",
                      "--retry-connrefused",
                      "--retry-delay", "0",
                      "--retry-max-time", "3600",
                      "--header", f"Authorization: LOW {ACCESS_KEY}:{SECRET_KEY}",
                      "--header", "x-archive-cascade-delete:1",
                      # Do not preserve the deleted object under history/files/.
                      "--header", "x-archive-keep-old-version:0",
                      "--write-out", "%{http_code}",
                      "--output", "delete-response.txt",
                      remote_url("https://s3.us.archive.org", remote_name),
                  ],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              code = result.stdout.strip()
              if code not in {"200", "202", "204", "404"}:
                  body = pathlib.Path("delete-response.txt").read_text(
                      encoding="utf-8", errors="replace"
                  )
                  raise RuntimeError(
                      f"Delete failed for {remote_name!r}: HTTP {code}: {body[:1000]}"
                  )

          def fetch_item() -> tuple[dict[str, dict], dict, bool]:
              encoded_item = urllib.parse.quote(ITEM, safe="")
              payload = get_json_with_retry(
                  lambda: (
                      f"https://archive.org/metadata/{encoded_item}"
                      f"?metadata_read={int(time.time())}-{random.random()}"
                  ),
                  label=f"Metadata read for {ITEM}",
                  not_found=None,
                  attempts=8,
                  tolerate_unavailable=True,
              )
              if not isinstance(payload, dict) or "files" not in payload:
                  return {}, {}, False
              files = {
                  entry["name"]: entry
                  for entry in payload.get("files", [])
                  if isinstance(entry, dict) and isinstance(entry.get("name"), str)
              }
              metadata = payload.get("metadata")
              return files, metadata if isinstance(metadata, dict) else {}, True

          def download_remote_state() -> dict | None:
              payload = get_json_with_retry(
                  lambda: (
                      remote_url("https://archive.org/download", IA_STATE_NAME)
                      + f"?state_read={int(time.time())}-{random.random()}"
                  ),
                  label=f"Checkpoint download for {ITEM}",
                  not_found=None,
                  attempts=5,
                  tolerate_unavailable=True,
              )
              return payload if isinstance(payload, dict) else None

          def load_controller_state() -> dict | None:
              if not CONTROLLER_STATE_PATH.exists():
                  return None
              try:
                  aggregate = json.loads(
                      CONTROLLER_STATE_PATH.read_text(encoding="utf-8")
                  )
              except (OSError, json.JSONDecodeError):
                  return None
              candidate = aggregate.get("targets", {}).get(SLUG)
              return candidate if isinstance(candidate, dict) else None

          def default_wayback() -> dict:
              return {
                  "pending": [],
                  "completed": 0,
                  "permanent_failures": 0,
                  "recent_failures": [],
                  "initial_queue_created": False,
                  "last_processed_at_utc": None,
              }

          def default_state() -> dict:
              return {
                  "schema_version": SCHEMA_VERSION,
                  "archive_mode": ARCHIVE_MODE,
                  "target": {
                      "repository": REPOSITORY,
                      "slug": SLUG,
                      "title": TITLE,
                      "marker": MARKER,
                      "kind": KIND,
                      "sites": SITES,
                      "ia_item": ITEM,
                      "window": WINDOW,
                  },
                  "initial_sync_completed": False,
                  "files": {},
                  "directories": [],
                  "archive": {},
                  "wayback": default_wayback(),
                  "last_completed_snapshot": None,
                  "last_completed_at_utc": None,
                  "last_completed_at_greece": None,
                  "last_result": {},
                  "current_run": {},
              }

          def allowed_live_url(url: object) -> bool:
              if KIND != "website" or not isinstance(url, str):
                  return False
              return any(
                  url == site or url.startswith(site + "/") for site in SITES
              )

          def sanitize_wayback(wayback: dict) -> None:
              wayback.setdefault("pending", [])
              wayback.setdefault("completed", 0)
              wayback.setdefault("permanent_failures", 0)
              wayback.setdefault("recent_failures", [])
              wayback.setdefault("initial_queue_created", False)
              wayback["pending"] = [
                  url for url in wayback["pending"] if allowed_live_url(url)
              ]
              wayback["recent_failures"] = [
                  entry for entry in wayback["recent_failures"]
                  if isinstance(entry, dict) and allowed_live_url(entry.get("url"))
              ]
              if not allowed_live_url(wayback.get("last_successful_url")):
                  wayback.pop("last_successful_url", None)
                  wayback.pop("last_successful_at_utc", None)
              transient = wayback.get("last_transient_error")
              if not (
                  isinstance(transient, dict)
                  and allowed_live_url(transient.get("url"))
              ):
                  wayback.pop("last_transient_error", None)
              wayback["remaining"] = len(wayback["pending"])
              if KIND != "website":
                  wayback.update({
                      "pending": [],
                      "completed": 0,
                      "permanent_failures": 0,
                      "recent_failures": [],
                      "initial_queue_created": True,
                      "remaining": 0,
                  })
                  wayback.pop("last_processed_at_utc", None)
                  wayback.pop("last_batch", None)

          def sanitize_state(candidate: dict | None) -> dict:
              base = default_state()
              if not isinstance(candidate, dict):
                  return base

              old_files = candidate.get("files")
              if isinstance(old_files, dict):
                  # Strip old per-file Internet Archive object names. State now
                  # describes the working tree, not a remote mirror layout.
                  cleaned: dict[str, dict] = {}
                  for path, metadata in old_files.items():
                      if not isinstance(path, str) or not isinstance(metadata, dict):
                          continue
                      metadata = dict(metadata)
                      metadata.pop("remote_name", None)
                      cleaned[path] = metadata
                  base["files"] = cleaned

              if isinstance(candidate.get("directories"), list):
                  base["directories"] = candidate["directories"]
              if isinstance(candidate.get("archive"), dict):
                  base["archive"] = candidate["archive"]
              if isinstance(candidate.get("wayback"), dict):
                  base["wayback"].update(candidate["wayback"])
              for key in (
                  "initial_sync_completed",
                  "last_completed_snapshot",
                  "last_completed_at_utc",
                  "last_completed_at_greece",
              ):
                  if key in candidate:
                      base[key] = candidate[key]
              if isinstance(candidate.get("last_result"), dict):
                  base["last_result"] = candidate["last_result"]

              sanitize_wayback(base["wayback"])
              base["schema_version"] = SCHEMA_VERSION
              base["archive_mode"] = ARCHIVE_MODE
              base.pop("git_bundle", None)
              base.pop("last_completed_commit", None)
              return base

          remote_state = download_remote_state()
          controller_state = load_controller_state()

          def state_timestamp(candidate: dict | None) -> str:
              if not isinstance(candidate, dict):
                  return ""
              return str(
                  candidate.get("state_updated_at_utc")
                  or candidate.get("last_completed_at_utc")
                  or ""
              )

          candidates = []
          if isinstance(remote_state, dict):
              candidates.append((state_timestamp(remote_state), "internet_archive", remote_state))
          if isinstance(controller_state, dict):
              candidates.append((state_timestamp(controller_state), "github_update_json", controller_state))

          if candidates:
              _, state_source, selected_state = max(candidates, key=lambda item: item[0])
              state = sanitize_state(selected_state)
          else:
              state = default_state()
              state_source = "new_initial_sync"

          def write_local_state() -> None:
              LOCAL_STATE_PATH.write_text(
                  json.dumps(
                      state,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True,
                  ) + "\n",
                  encoding="utf-8",
              )

          def inventory_working_tree() -> tuple[dict[str, dict], list[str]]:
              files: dict[str, dict] = {}
              directories: set[str] = set()
              pending: list[tuple[str, pathlib.Path, int, int]] = []

              for root, directory_names, filenames in os.walk(
                  SOURCE_ROOT, topdown=True, followlinks=False
              ):
                  directory_names[:] = sorted(
                      name for name in directory_names if name != ".git"
                  )
                  root_path = pathlib.Path(root)
                  relative_root = root_path.relative_to(SOURCE_ROOT)
                  if str(relative_root) != ".":
                      directories.add(relative_root.as_posix())

                  for name in sorted(filenames):
                      if name == ".git":
                          continue
                      path = root_path / name
                      relative = path.relative_to(SOURCE_ROOT).as_posix()
                      if ".git" in pathlib.PurePosixPath(relative).parts:
                          continue

                      if path.is_symlink():
                          target = os.readlink(path)
                          files[relative] = {
                              "sha256": hashlib.sha256(
                                  ("SYMLINK\0" + target).encode("utf-8")
                              ).hexdigest(),
                              "size": len(target.encode("utf-8")),
                              "type": "symlink",
                              "link_target": target,
                              "mode": "0777",
                          }
                          continue

                      try:
                          st = path.stat()
                      except OSError:
                          continue
                      if not stat.S_ISREG(st.st_mode):
                          continue
                      pending.append((relative, path, st.st_mode & 0o777, st.st_size))

              if pending:
                  workers = min(4, max(1, os.cpu_count() or 1), len(pending))
                  print(f"Hashing {len(pending)} working-tree files with {workers} workers.")
                  with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as pool:
                      futures = {
                          pool.submit(sha256_file, path): (relative, mode, size)
                          for relative, path, mode, size in pending
                      }
                      for future in concurrent.futures.as_completed(futures):
                          relative, mode, size = futures[future]
                          files[relative] = {
                              "sha256": future.result(),
                              "size": size,
                              "type": "file",
                              "mode": f"{mode:04o}",
                              "executable": bool(mode & stat.S_IXUSR),
                          }

              return dict(sorted(files.items())), sorted(directories)

          def make_deterministic_archive(
              files: dict[str, dict], directories: list[str]
          ) -> pathlib.Path:
              output = pathlib.Path(ARCHIVE_NAME)
              with output.open("wb") as raw:
                  with gzip.GzipFile(
                      filename="", mode="wb", fileobj=raw, mtime=0, compresslevel=9
                  ) as compressed:
                      with tarfile.open(
                          fileobj=compressed,
                          mode="w",
                          format=tarfile.PAX_FORMAT,
                      ) as archive:
                          for relative in directories:
                              info = tarfile.TarInfo(relative.rstrip("/") + "/")
                              info.type = tarfile.DIRTYPE
                              info.mode = 0o755
                              info.uid = info.gid = 0
                              info.uname = info.gname = ""
                              info.mtime = 0
                              archive.addfile(info)

                          for relative, metadata in files.items():
                              info = tarfile.TarInfo(relative)
                              info.uid = info.gid = 0
                              info.uname = info.gname = ""
                              info.mtime = 0
                              info.mode = int(metadata.get("mode", "0644"), 8)
                              if metadata["type"] == "symlink":
                                  info.type = tarfile.SYMTYPE
                                  info.linkname = metadata["link_target"]
                                  info.size = 0
                                  archive.addfile(info)
                              else:
                                  source_path = SOURCE_ROOT / pathlib.PurePosixPath(relative)
                                  info.size = metadata["size"]
                                  with source_path.open("rb") as stream:
                                      archive.addfile(info, stream)
              return output

          def build_wayback_urls(paths: list[str], include_all: bool) -> list[str]:
              if KIND != "website":
                  return []
              selected = sorted(current_files) if include_all else sorted(paths)
              excluded_prefixes = (".git/", ".github/")
              excluded_names = {
                  ".gitignore", ".gitattributes", ".nojekyll",
                  "README", "README.md", "README.txt",
                  "LICENSE", "LICENSE.md", "LICENSE.txt", "SECURITY.md",
              }
              urls: set[str] = {site + "/" for site in SITES}
              for relative in selected:
                  if (
                      relative.startswith(excluded_prefixes)
                      or relative in excluded_names
                      or "/." in relative
                  ):
                      continue
                  encoded = urllib.parse.quote(relative, safe="/~._-()")
                  for site in SITES:
                      urls.add(f"{site}/{encoded}")
                      lower = relative.lower()
                      if lower == "index.html":
                          urls.add(site + "/")
                      elif lower.endswith("/index.html"):
                          urls.add(f"{site}/{encoded[:-len('index.html')]}")
              return sorted(urls)

          def patch_item_metadata(current: dict) -> None:
              desired = {
                  "description": (
                      f"Current working-tree-only archive for {REPOSITORY}. "
                      "Git history, commit history and push history are intentionally excluded."
                  ),
                  "subject": (
                      "DedSec Project; source code; working tree; software preservation"
                  ),
              }
              patch = []
              for key, value in desired.items():
                  if current.get(key) == value:
                      continue
                  patch.append({
                      "op": "replace" if key in current else "add",
                      "path": f"/{key}",
                      "value": value,
                  })
              if not patch:
                  return

              payload = urllib.parse.urlencode({
                  "-target": "metadata",
                  "-patch": json.dumps(patch, separators=(",", ":")),
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://archive.org/metadata/{urllib.parse.quote(ITEM, safe='')}",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"LOW {ACCESS_KEY}:{SECRET_KEY}",
                      "Content-Type": "application/x-www-form-urlencoded",
                      "Accept": "application/json",
                      "X-Accept-Reduced-Priority": "1",
                      "User-Agent": "DedSec-Archive-Sync/7.0",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      result = json.load(response)
                  if not result.get("success", False):
                      print(
                          "::warning title=Metadata update rejected::"
                          f"{result.get('error', result)!r}"
                      )
              except Exception as error:
                  print(
                      "::warning title=Metadata update deferred::"
                      f"{error!r}. The archive content is unaffected."
                  )

          old_files = state.get("files", {}) if isinstance(state.get("files"), dict) else {}
          old_snapshot = state.get("last_completed_snapshot")
          current_files, current_directories = inventory_working_tree()
          snapshot_payload = json.dumps(
              {"directories": current_directories, "files": current_files},
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          current_snapshot = hashlib.sha256(snapshot_payload).hexdigest()

          changed_paths = sorted(
              path
              for path, metadata in current_files.items()
              if old_files.get(path) != metadata
          )
          removed_paths = sorted(set(old_files) - set(current_files))
          unchanged_count = len(current_files) - len(changed_paths)

          snapshot_changed = old_snapshot != current_snapshot
          archive_state = state.get("archive") if isinstance(state.get("archive"), dict) else {}
          known_remote_complete = (
              bool(state.get("initial_sync_completed"))
              and archive_state.get("snapshot_sha256") == current_snapshot
          )

          # Do not hit Internet Archive on every scheduled run when nothing has
          # changed. A known-good unchanged mirror is remotely rechecked at most
          # once every seven days.
          verification_due = True
          last_verified = state.get("last_remote_verified_at_utc")
          if known_remote_complete and isinstance(last_verified, str):
              try:
                  last_dt = datetime.fromisoformat(last_verified.replace("Z", "+00:00"))
                  verification_due = (
                      datetime.now(timezone.utc) - last_dt >= timedelta(days=7)
                  )
              except ValueError:
                  verification_due = True

          remote_files: dict[str, dict] = {}
          item_metadata: dict = {}
          metadata_reliable = False
          if snapshot_changed or not known_remote_complete or verification_due:
              remote_files, item_metadata, metadata_reliable = fetch_item()
              archive_present = ARCHIVE_NAME in remote_files
              manifest_present = MANIFEST_NAME in remote_files
              checksums_present = CHECKSUM_NAME in remote_files
          else:
              archive_present = manifest_present = checksums_present = True
              print("Unchanged known-good snapshot; remote metadata read skipped.")

          must_upload_snapshot = (
              snapshot_changed
              or not archive_present
              or not manifest_present
              or not checksums_present
          )

          state["current_run"] = {
              "status": "running",
              "run_id": RUN_ID,
              "run_attempt": RUN_ATTEMPT,
              "started_at_utc": utc_now(),
              "state_source": state_source,
              "total_current_files": len(current_files),
              "snapshot_changed": snapshot_changed,
              "compact_archive_upload_required": must_upload_snapshot,
          }
          write_local_state()

          archive_path = pathlib.Path(ARCHIVE_NAME)
          manifest_path = pathlib.Path(MANIFEST_NAME)
          checksum_path = pathlib.Path(CHECKSUM_NAME)

          try:
              archive_uploaded = False
              if must_upload_snapshot:
                  print(
                      f"Creating one compact archive for {len(current_files)} files "
                      f"and {len(current_directories)} directories."
                  )
                  archive_path = make_deterministic_archive(
                      current_files, current_directories
                  )
                  archive_sha256 = sha256_file(archive_path)

                  manifest = {
                      "schema_version": SCHEMA_VERSION,
                      "archive_mode": ARCHIVE_MODE,
                      "generated_at_utc": utc_now(),
                      "repository": REPOSITORY,
                      "title": TITLE,
                      "kind": KIND,
                      "sites": SITES,
                      "snapshot_sha256": current_snapshot,
                      "archive_file": ARCHIVE_NAME,
                      "archive_sha256": archive_sha256,
                      "archive_size": archive_path.stat().st_size,
                      "directories": current_directories,
                      "file_count": len(current_files),
                      "files": current_files,
                  }
                  manifest_path.write_text(
                      json.dumps(
                          manifest,
                          indent=2,
                          ensure_ascii=False,
                          sort_keys=True,
                      ) + "\n",
                      encoding="utf-8",
                  )
                  checksum_path.write_text(
                      "".join(
                          f"{metadata['sha256']}  {relative}\n"
                          for relative, metadata in sorted(current_files.items())
                      ) + f"{archive_sha256}  {ARCHIVE_NAME}\n",
                      encoding="utf-8",
                  )

                  first_item_write = not metadata_reliable
                  upload_file(
                      archive_path,
                      ARCHIVE_NAME,
                      include_item_metadata=first_item_write,
                  )
                  upload_file(manifest_path, MANIFEST_NAME)
                  upload_file(checksum_path, CHECKSUM_NAME)
                  archive_uploaded = True
                  state["archive"] = {
                      "remote_name": ARCHIVE_NAME,
                      "sha256": archive_sha256,
                      "size": archive_path.stat().st_size,
                      "snapshot_sha256": current_snapshot,
                      "updated_at_utc": utc_now(),
                  }
              else:
                  print("Working-tree snapshot is unchanged; compact archive upload skipped.")

              # Only live websites are queued for Wayback. No repository, commit,
              # branch, tag, raw/blob or commit-pinned GitHub URLs are ever queued.
              wayback_urls = build_wayback_urls(
                  changed_paths,
                  include_all=not state["wayback"].get(
                      "initial_queue_created", False
                  ),
              )
              pending = list(state["wayback"].get("pending", []))
              pending_set = set(pending)
              for url in wayback_urls:
                  if url not in pending_set:
                      pending.append(url)
                      pending_set.add(url)
              state["wayback"]["pending"] = pending
              state["wayback"]["remaining"] = len(pending)
              state["wayback"]["initial_queue_created"] = True
              state["wayback"]["last_queue_update_at_utc"] = utc_now()
              state["wayback"]["last_queue_added"] = len(wayback_urls)
              sanitize_wayback(state["wayback"])

              # Purge only explicitly historical artifacts from the old design.
              # Old mirror/* working-tree objects are intentionally not mass-deleted
              # here because thousands of DELETE tasks reproduce the IA SlowDown
              # failure. They are no longer updated and cannot capture future pushes.
              history_candidates: list[str] = []
              if metadata_reliable:
                  for name in remote_files:
                      lowered = name.lower()
                      legacy_archive = any(
                          name.startswith(prefix)
                          or (
                              name.startswith(".~~")
                              and name.removeprefix(".~~").startswith(prefix)
                          )
                          for prefix in LEGACY_PREFIXES
                      )
                      history_object = (
                          "git-history" in lowered
                          or lowered.startswith("history/files/")
                          or legacy_archive
                      )
                      if history_object and name not in {
                          ARCHIVE_NAME, MANIFEST_NAME, CHECKSUM_NAME, IA_STATE_NAME
                      }:
                          history_candidates.append(name)

              deleted_history = 0
              cleanup_pending = list(sorted(set(history_candidates)))
              # Keep cleanup bounded so it can never recreate the old hundreds-of-
              # requests failure. Remaining historical objects are retried next run.
              for name in cleanup_pending[:1]:
                  try:
                      print(f"Deleting historical archive object: {name}")
                      delete_remote(name)
                      deleted_history += 1
                  except Exception as error:
                      print(
                          "::warning title=Historical cleanup deferred::"
                          f"{name}: {error!r}"
                      )
                      break

              # Correct old item metadata that mentioned Git history. This uses the
              # official Metadata API and accepts reduced priority to avoid 429s.
              if metadata_reliable:
                  patch_item_metadata(item_metadata)

              final_files: dict[str, dict] = {}
              required_remote_files = {ARCHIVE_NAME, MANIFEST_NAME, CHECKSUM_NAME}
              if not must_upload_snapshot and known_remote_complete and not verification_due:
                  verified = True
              elif (
                  not must_upload_snapshot
                  and metadata_reliable
                  and required_remote_files.issubset(remote_files)
              ):
                  # The weekly metadata read already proved the mirror is intact;
                  # do not immediately read the exact same metadata a second time.
                  verified = True
                  final_files = remote_files
                  state["last_remote_verified_at_utc"] = utc_now()
              else:
                  verified = False
                  # One immediate verification plus at most two backed-off retries.
                  # Six metadata polls per target caused unnecessary pressure.
                  for attempt in range(1, 4):
                      final_files, _, reliable = fetch_item()
                      if reliable and required_remote_files.issubset(final_files):
                          verified = True
                          state["last_remote_verified_at_utc"] = utc_now()
                          break
                      wait = delay_for(attempt)
                      print(f"Compact archive verification waiting {wait}s.")
                      time.sleep(wait)

              state["files"] = current_files
              state["directories"] = current_directories
              state["last_completed_snapshot"] = current_snapshot
              state["last_completed_at_utc"] = utc_now()
              state["last_completed_at_greece"] = greece_now()
              state["initial_sync_completed"] = verified
              state["last_result"] = {
                  "snapshot_changed": snapshot_changed,
                  "archive_uploaded": archive_uploaded,
                  "changed_or_added_files": len(changed_paths),
                  "deleted_from_repository": len(removed_paths),
                  "unchanged_files": unchanged_count,
                  "mirror_verified": verified,
                  "deleted_history_archives": deleted_history,
                  "history_cleanup_pending": max(
                      0, len(cleanup_pending) - deleted_history
                  ),
                  "legacy_mirror_objects_visible": (
                      sum(1 for name in final_files if name.startswith("mirror/"))
                      if verified else None
                  ),
                  "wayback_pending": len(state["wayback"].get("pending", [])),
              }
              state["current_run"].update({
                  "status": "complete" if verified else "uploaded_unverified",
                  "completed_at_utc": utc_now(),
              })

              # One remote checkpoint per target run, not one per source file.
              # If IA is still overloaded after the long retry window, the local
              # GitHub artifact remains authoritative and the next run selects the
              # newest state by timestamp instead of blindly preferring remote state.
              state["state_updated_at_utc"] = utc_now()
              state["last_result"]["remote_state_checkpoint_uploaded"] = False
              write_local_state()
              remote_checkpoint_needed = (
                  archive_uploaded
                  or bool(wayback_urls)
                  or deleted_history > 0
                  or verification_due
              )
              if remote_checkpoint_needed:
                  try:
                      upload_file(LOCAL_STATE_PATH, IA_STATE_NAME)
                      state["last_result"]["remote_state_checkpoint_uploaded"] = True
                      state["state_updated_at_utc"] = utc_now()
                      write_local_state()
                  except Exception as checkpoint_error:
                      print(
                          "::warning title=Remote checkpoint deferred::"
                          f"{redact_sensitive(checkpoint_error)}. Local GitHub state will be used next run."
                      )
              else:
                  print("No remote changes; Internet Archive checkpoint upload skipped.")

          except BaseException as error:
              state["current_run"]["status"] = "failed"
              state["current_run"]["failed_at_utc"] = utc_now()
              state["current_run"]["error"] = redact_sensitive(
                  f"{type(error).__name__}: {error}"
              )
              state["current_run"]["traceback"] = redact_sensitive(
                  traceback.format_exc()[-8000:]
              )
              state["state_updated_at_utc"] = utc_now()
              write_local_state()
              # Do not perform an additional remote checkpoint upload on failure;
              # that was a major source of 503 SlowDown amplification. The local
              # GitHub artifact below preserves enough state for diagnostics.
              raise

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slug={SLUG}\n")
              output.write(f"status={state['current_run']['status']}\n")
              output.write(
                  f"uploaded={int(bool(state['last_result'].get('archive_uploaded')))}\n"
              )
              output.write(
                  f"wayback_pending={len(state['wayback'].get('pending', []))}\n"
              )
          PY

      - name: Upload local checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-checkpoint-${{ matrix.slug }}-${{ github.run_id }}
          path: archive-state/${{ matrix.slug }}.json
          if-no-files-found: ignore
          retention-days: 14

  software-heritage:
    name: Preserve repositories in Software Heritage
    needs: prepare
    if: needs.prepare.outputs.target_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SELECTED_TARGETS: ${{ needs.prepare.outputs.selected_targets }}
      ALL_TARGETS: ${{ needs.prepare.outputs.all_targets }}
      SWH_STATE_PATH: software-heritage.json
      SWH_PREVIOUS_STATE_PATH: controller/update.json

    steps:
      - name: Check out archive controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 1

      - name: Resolve previous requests and submit current Software Heritage preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/.github/scripts/software_heritage.py

      - name: Upload Software Heritage state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preservation-software-heritage-${{ github.run_id }}
          path: software-heritage.json
          if-no-files-found: ignore
          retention-days: 30

  sync-apks:
    name: Preserve current APK dependencies
    needs:
      - prepare
      - sync-targets
    if: |
      always() &&
      needs.prepare.outputs.target_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}
      APK_IA_ITEM_IDENTIFIER: dedsec1121fk-dedsec-project-apk-backups
      APK_STATE_PATH: apks.json

    steps:
      - name: Check out archive controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 1

      - name: Download and synchronize APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/.github/scripts/archive_apks.py

      - name: Upload APK preservation state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preservation-apks-${{ github.run_id }}
          path: apks.json
          if-no-files-found: ignore
          retention-days: 30

  process-wayback:
    name: Process resumable Wayback queue
    needs:
      - prepare
      - sync-targets
      - sync-apks
    if: |
      always() &&
      needs.prepare.outputs.target_count != '0'
    # MAINTENANCE: Standard runner only; Wayback is network/rate-limit bound.
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      SELECTED_TARGETS: ${{ needs.prepare.outputs.selected_targets }}
      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}
      MAX_URLS_PER_RUN: "24"
      MAX_SECONDS_PER_RUN: "7200"

    steps:
      - name: Process URLs serially with checkpoints
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import random
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          targets = [
              target
              for target in json.loads(os.environ["SELECTED_TARGETS"])
              if target.get("kind") == "website"
          ]
          access = os.environ["IA_ACCESS_KEY"]
          secret = os.environ["IA_SECRET_KEY"]
          max_urls = int(os.environ["MAX_URLS_PER_RUN"])
          max_seconds = int(os.environ["MAX_SECONDS_PER_RUN"])
          started = time.monotonic()
          retryable = {408, 425, 429, 500, 502, 503, 504}

          def utc_now() -> str:
              return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def state_url(target: dict) -> str:
              item = urllib.parse.quote(target["ia_item"], safe="")
              return (
                  f"https://archive.org/download/{item}/"
                  f"archive-state/update.json"
                  f"?wayback_read={int(time.time())}-{random.random()}"
              )

          def upload_state(target: dict, state: dict) -> None:
              state["state_updated_at_utc"] = utc_now()
              path = pathlib.Path(f"state-{target['slug']}.json")
              path.write_text(
                  json.dumps(
                      state,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
              item = urllib.parse.quote(target["ia_item"], safe="")
              remote_name = "archive-state/update.json"

              subprocess.run(
                  [
                      "curl",
                      "--silent",
                      "--show-error",
                      "--fail-with-body",
                      "--location",
                      "--location-trusted",
                      "--retry",
                      "8",
                      "--retry-connrefused",
                      "--retry-delay",
                      "0",
                      "--retry-max-time",
                      "3600",
                      "--header",
                      f"Authorization: LOW {access}:{secret}",
                      "--header",
                      "x-amz-auto-make-bucket:1",
                      "--header",
                      "x-archive-ignore-preexisting-bucket:1",
                      "--header",
                      "x-archive-keep-old-version:0",
                      "--header",
                      "x-archive-queue-derive:0",
                      "--upload-file",
                      str(path),
                      (
                          f"https://s3.us.archive.org/{item}/"
                          + urllib.parse.quote(
                              remote_name,
                              safe="/~._-()",
                          )
                      ),
                  ],
                  check=True,
              )

          def fetch_state(target: dict) -> dict | None:
              last_error = None

              for attempt in range(1, 7):
                  request = urllib.request.Request(
                      state_url(target),
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": "DedSec-Wayback-Queue/7.0",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120,
                      ) as response:
                          state = json.load(response)
                      return state if isinstance(state, dict) else None

                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return None

                      last_error = error
                      if error.code not in retryable:
                          raise

                      retry_after = error.headers.get("Retry-After")
                      delay = (
                          min(900, int(retry_after))
                          if retry_after and retry_after.isdigit()
                          else min(120, 10 * (2 ** min(attempt - 1, 4)))
                      )
                      print(
                          f"{target['slug']}: state HTTP {error.code}; "
                          f"retry {attempt}/6 in {delay}s."
                      )
                      time.sleep(delay)

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      json.JSONDecodeError,
                      UnicodeDecodeError,
                  ) as error:
                      last_error = error
                      delay = min(120, 10 * (2 ** min(attempt - 1, 4)))
                      print(
                          f"{target['slug']}: temporary state error; "
                          f"retry {attempt}/6 in {delay}s."
                      )
                      time.sleep(delay)

              print(
                  "::warning title=Wayback state unavailable::"
                  f"{target['slug']}: {last_error!r}"
              )
              return None

          def submit_url(url: str) -> tuple[str, str | None]:
              payload = urllib.parse.urlencode({
                  "url": url,
                  "capture_outlinks": "0",
                  "capture_screenshot": "0",
                  "skip_first_archive": "0",
              }).encode("utf-8")

              last_error = None

              for attempt in range(1, 5):
                  request = urllib.request.Request(
                      "https://web.archive.org/save",
                      data=payload,
                      method="POST",
                      headers={
                          "Authorization": f"LOW {access}:{secret}",
                          "Accept": "application/json",
                          "User-Agent": "DedSec-Wayback-Queue/7.0",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=150,
                      ) as response:
                          response.read()
                      return "accepted", None

                  except urllib.error.HTTPError as error:
                      body = error.read().decode("utf-8", "replace")
                      last_error = f"HTTP {error.code}: {body[:800]}"

                      if error.code == 403 and (
                          "InvalidAccessKeyId" in body
                          or "SignatureDoesNotMatch" in body
                      ):
                          raise RuntimeError(
                              "Internet Archive rejected the configured credentials."
                          )

                      session_limit = (
                          "user-session-limit" in body
                          or "active Save Page Now sessions" in body
                      )

                      if error.code == 429 or session_limit:
                          # Do not hammer Save Page Now after it explicitly asks us
                          # to slow down. Requeue this URL and end the batch.
                          return "rate_limited", last_error

                      if error.code not in retryable:
                          return "permanent_failure", last_error

                      retry_after = error.headers.get("Retry-After")
                      delay = (
                          min(900, int(retry_after))
                          if retry_after and retry_after.isdigit()
                          else (65 if session_limit or error.code == 429 else 30)
                      )
                      print(
                          f"Wayback temporary error for {url}: "
                          f"{last_error}; retry {attempt}/4 in {delay}s."
                      )
                      time.sleep(delay)

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                  ) as error:
                      last_error = repr(error)
                      time.sleep(30)

              return "transient_failure", last_error

          def allowed_live_site_url(target: dict, url: object) -> bool:
              if target.get("kind") != "website" or not isinstance(url, str):
                  return False
              sites = [
                  site.strip().rstrip("/")
                  for site in str(target.get("sites", "")).split("|")
                  if site.strip()
              ]
              return any(
                  url == site or url.startswith(site + "/")
                  for site in sites
              )

          loaded: list[tuple[dict, dict]] = []
          for target in targets:
              state = fetch_state(target)
              if not isinstance(state, dict):
                  continue
              state.pop("git_bundle", None)
              state.pop("last_completed_commit", None)
              state["schema_version"] = 7
              state["archive_mode"] = "single_current_working_tree_archive"
              current_run = state.get("current_run")
              if isinstance(current_run, dict):
                  current_run.pop("source_commit", None)
              state.setdefault("wayback", {})
              state["wayback"].setdefault("pending", [])
              state["wayback"].setdefault("completed", 0)
              state["wayback"].setdefault("permanent_failures", 0)
              state["wayback"].setdefault("recent_failures", [])
              state["wayback"]["pending"] = [
                  url
                  for url in state["wayback"]["pending"]
                  if allowed_live_site_url(target, url)
              ]
              state["wayback"]["recent_failures"] = [
                  entry
                  for entry in state["wayback"]["recent_failures"]
                  if isinstance(entry, dict)
                  and allowed_live_site_url(target, entry.get("url"))
              ]
              if not allowed_live_site_url(
                  target, state["wayback"].get("last_successful_url")
              ):
                  state["wayback"].pop("last_successful_url", None)
                  state["wayback"].pop("last_successful_at_utc", None)
              transient = state["wayback"].get("last_transient_error")
              if not (
                  isinstance(transient, dict)
                  and allowed_live_site_url(target, transient.get("url"))
              ):
                  state["wayback"].pop("last_transient_error", None)
              state["wayback"]["remaining"] = len(
                  state["wayback"]["pending"]
              )
              if target.get("kind") != "website":
                  state["wayback"]["completed"] = 0
                  state["wayback"]["permanent_failures"] = 0
                  state["wayback"]["recent_failures"] = []
                  state["wayback"]["initial_queue_created"] = True
                  state["wayback"].pop("last_processed_at_utc", None)
                  state["wayback"].pop("last_batch", None)
              if isinstance(current_run, dict):
                  operation = current_run.get("last_successful_operation")
                  if isinstance(operation, dict) and (
                      operation.get("action") == "upload_git_bundle"
                      or operation.get("remote_name") == "git-history.bundle"
                  ):
                      current_run["last_successful_operation"] = None
              loaded.append((target, state))

          if not loaded:
              print("No Wayback queues were available. Nothing to process.")
              raise SystemExit(0)

          processed = 0
          accepted = 0
          permanent_failures = 0
          transient_deferrals = 0
          round_index = 0

          while (
              processed < max_urls
              and time.monotonic() - started < max_seconds
          ):
              active = [
                  (target, state)
                  for target, state in loaded
                  if state["wayback"].get("pending")
              ]
              if not active:
                  break

              target, state = active[round_index % len(active)]
              round_index += 1
              pending = state["wayback"]["pending"]
              url = pending.pop(0)

              print(
                  f"[Wayback {processed + 1}/{max_urls}] "
                  f"{target['slug']}: {url}"
              )
              result, error = submit_url(url)
              processed += 1

              if result == "accepted":
                  accepted += 1
                  state["wayback"]["completed"] += 1
                  state["wayback"]["last_successful_url"] = url
                  state["wayback"]["last_successful_at_utc"] = utc_now()

              elif result == "permanent_failure":
                  permanent_failures += 1
                  state["wayback"]["permanent_failures"] += 1
                  failures = state["wayback"]["recent_failures"]
                  failures.append({
                      "url": url,
                      "error": error,
                      "at_utc": utc_now(),
                  })
                  state["wayback"]["recent_failures"] = failures[-50:]

              else:
                  transient_deferrals += 1
                  pending.append(url)
                  state["wayback"]["last_transient_error"] = {
                      "url": url,
                      "error": error,
                      "at_utc": utc_now(),
                  }

              state["wayback"]["last_processed_at_utc"] = utc_now()
              state["wayback"]["remaining"] = len(pending)

              # Remote state is checkpointed once at the end of the batch.
              # Avoid periodic S3 writes that compete with archive uploads.

              if result == "rate_limited":
                  print("Wayback rate limit detected; ending this batch and deferring the queue.")
                  break
              if result == "transient_failure":
                  time.sleep(60)
              else:
                  # Keep Save Page Now requests serial and deliberately slow.
                  time.sleep(20)

          for target, state in loaded:
              state["wayback"]["last_batch"] = {
                  "processed_at_utc": utc_now(),
                  "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
                  "remaining": len(state["wayback"].get("pending", [])),
              }
              upload_state(target, state)

          report = {
              "processed_at_utc": utc_now(),
              "selected_targets": [target["slug"] for target, _ in loaded],
              "processed": processed,
              "accepted": accepted,
              "permanent_failures": permanent_failures,
              "transient_deferrals": transient_deferrals,
              "remaining_total": sum(
                  len(state["wayback"].get("pending", []))
                  for _, state in loaded
              ),
              "limit": max_urls,
              "time_limit_seconds": max_seconds,
          }

          pathlib.Path("wayback-batch-report.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(
              os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"),
              "a",
              encoding="utf-8",
          ) as output:
              output.write("## Resumable Wayback queue\n\n")
              output.write(f"- Processed: **{processed}**\n")
              output.write(f"- Accepted: **{accepted}**\n")
              output.write(
                  f"- Permanent failures: **{permanent_failures}**\n"
              )
              output.write(
                  f"- Temporarily deferred: **{transient_deferrals}**\n"
              )
              output.write(
                  f"- URLs still queued: **{report['remaining_total']}**\n"
              )
          PY

      - name: Upload Wayback batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-batch-report-${{ github.run_id }}
          path: wayback-batch-report.json
          if-no-files-found: ignore
          retention-days: 30

  update-controller-state:
    name: Update update.json and README
    needs:
      - prepare
      - sync-targets
      - process-wayback
      - software-heritage
      - sync-apks
    if: |
      always() &&
      needs.prepare.outputs.target_count != '0'
    # MAINTENANCE: Standard runner only.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SELECTED_TARGETS: ${{ needs.prepare.outputs.selected_targets }}
      ALL_TARGETS: ${{ needs.prepare.outputs.all_targets }}

    steps:
      - name: Check out archive controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 1

      - name: Download local checkpoint artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: archive-checkpoint-*-${{ github.run_id }}
          path: checkpoint-artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Download preservation state artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: preservation-*-${{ github.run_id }}
          path: preservation-artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Synchronize persistent update.json and README
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          SCHEMA_VERSION = 7
          ARCHIVE_MODE = "single_current_working_tree_archive"
          CONTROLLER = pathlib.Path("controller")
          UPDATE_PATH = CONTROLLER / "update.json"
          README_PATH = CONTROLLER / "README.md"
          ARTIFACT_DIR = pathlib.Path("checkpoint-artifacts")
          PRESERVATION_DIR = pathlib.Path("preservation-artifacts")
          targets = json.loads(os.environ["SELECTED_TARGETS"])
          all_targets = json.loads(os.environ["ALL_TARGETS"])
          retryable = {408, 425, 429, 500, 502, 503, 504}

          def utc_now() -> str:
              return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def fetch_remote_state(target: dict) -> dict | None:
              item = urllib.parse.quote(target["ia_item"], safe="")
              last_error = None

              for attempt in range(1, 7):
                  url = (
                      f"https://archive.org/download/{item}/"
                      f"archive-state/update.json"
                      f"?controller={int(time.time())}-{random.random()}"
                  )
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": "DedSec-Controller-State/7.0",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120,
                      ) as response:
                          state = json.load(response)
                      return state if isinstance(state, dict) else None

                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return None

                      last_error = error
                      if error.code not in retryable:
                          raise

                      retry_after = error.headers.get("Retry-After")
                      delay = (
                          min(900, int(retry_after))
                          if retry_after and retry_after.isdigit()
                          else min(120, 10 * (2 ** min(attempt - 1, 4)))
                      )
                      print(
                          f"{target['slug']}: controller HTTP {error.code}; "
                          f"retry {attempt}/6 in {delay}s."
                      )
                      time.sleep(delay)

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      json.JSONDecodeError,
                      UnicodeDecodeError,
                  ) as error:
                      last_error = error
                      delay = min(120, 10 * (2 ** min(attempt - 1, 4)))
                      print(
                          f"{target['slug']}: temporary controller error; "
                          f"retry {attempt}/6 in {delay}s."
                      )
                      time.sleep(delay)

              print(
                  "::warning title=Remote state unavailable::"
                  f"{target['slug']}: {last_error!r}"
              )
              return None

          def load_artifact_state(slug: str) -> dict | None:
              candidates = list(ARTIFACT_DIR.rglob(f"{slug}.json"))
              for path in candidates:
                  try:
                      state = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  if isinstance(state, dict):
                      return state
              return None

          def load_preservation_state(filename: str) -> dict | None:
              for path in PRESERVATION_DIR.rglob(filename):
                  try:
                      state = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  if isinstance(state, dict):
                      return state
              return None

          try:
              aggregate = json.loads(UPDATE_PATH.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              aggregate = {
                  "schema_version": SCHEMA_VERSION,
                  "generated_at_utc": None,
                  "targets": {},
              }

          aggregate["schema_version"] = SCHEMA_VERSION
          aggregate.setdefault("targets", {})

          refreshed: dict[str, dict] = {}

          def sanitize_controller_state(target: dict, state: dict) -> dict:
              state.pop("git_bundle", None)
              state.pop("last_completed_commit", None)
              state["schema_version"] = SCHEMA_VERSION
              state["archive_mode"] = ARCHIVE_MODE
              state.setdefault("target", {})
              state["target"].update({
                  "repository": target["repository"],
                  "slug": target["slug"],
                  "title": target["title"],
                  "marker": target["marker"],
                  "kind": target["kind"],
                  "ia_item": target["ia_item"],
                  "window": target["window"],
                  "sites": [
                      site.strip().rstrip("/")
                      for site in str(target.get("sites", "")).split("|")
                      if site.strip()
                  ],
              })
              files = state.get("files")
              if isinstance(files, dict):
                  for metadata in files.values():
                      if isinstance(metadata, dict):
                          metadata.pop("remote_name", None)
              current_run = state.get("current_run")
              if isinstance(current_run, dict):
                  current_run.pop("source_commit", None)
              wayback = state.setdefault("wayback", {})
              sites = state["target"]["sites"]
              def allowed(url: object) -> bool:
                  return target.get("kind") == "website" and isinstance(url, str) and any(
                      url == site or url.startswith(site + "/") for site in sites
                  )
              wayback["pending"] = [
                  url for url in wayback.get("pending", []) if allowed(url)
              ]
              wayback["recent_failures"] = [
                  entry for entry in wayback.get("recent_failures", [])
                  if isinstance(entry, dict) and allowed(entry.get("url"))
              ]
              if not allowed(wayback.get("last_successful_url")):
                  wayback.pop("last_successful_url", None)
                  wayback.pop("last_successful_at_utc", None)
              transient = wayback.get("last_transient_error")
              if not (isinstance(transient, dict) and allowed(transient.get("url"))):
                  wayback.pop("last_transient_error", None)
              wayback["remaining"] = len(wayback["pending"])
              if target.get("kind") != "website":
                  wayback["completed"] = 0
                  wayback["permanent_failures"] = 0
                  wayback["recent_failures"] = []
                  wayback["initial_queue_created"] = True
                  wayback.pop("last_processed_at_utc", None)
                  wayback.pop("last_batch", None)
              if isinstance(current_run, dict):
                  operation = current_run.get("last_successful_operation")
                  if isinstance(operation, dict) and (
                      operation.get("action") == "upload_git_bundle"
                      or operation.get("remote_name") == "git-history.bundle"
                  ):
                      current_run["last_successful_operation"] = None
              return state

          definitions_by_slug = {
              target["slug"]: target for target in all_targets
          }
          for slug, existing in list(aggregate["targets"].items()):
              definition = definitions_by_slug.get(slug)
              if definition and isinstance(existing, dict):
                  aggregate["targets"][slug] = sanitize_controller_state(
                      definition,
                      existing,
                  )

          for target in targets:
              remote = fetch_remote_state(target)
              artifact = load_artifact_state(target["slug"])
              previous = aggregate["targets"].get(target["slug"])

              # Choose the newest available state. Wayback normally makes remote
              # state newest; if an IA checkpoint was rate-limited, the local sync
              # artifact can safely win instead of losing the completed snapshot.
              candidates = [
                  candidate
                  for candidate in (remote, artifact, previous)
                  if isinstance(candidate, dict)
              ]
              state = max(
                  candidates,
                  key=lambda candidate: str(
                      candidate.get("state_updated_at_utc")
                      or candidate.get("last_completed_at_utc")
                      or ""
                  ),
              ) if candidates else None

              if state is None:
                  print(
                      f"::warning title=No state available::{target['slug']}"
                  )
                  continue

              state = sanitize_controller_state(target, state)
              aggregate["targets"][target["slug"]] = state
              refreshed[target["slug"]] = state

          software_heritage_state = load_preservation_state("software-heritage.json")
          if software_heritage_state is not None:
              aggregate["software_heritage"] = software_heritage_state

          apk_state = load_preservation_state("apks.json")
          if apk_state is not None:
              aggregate["apks"] = apk_state

          aggregate["generated_at_utc"] = utc_now()
          aggregate["source_of_truth"] = (
              "Each Internet Archive repository/website item stores archive-state/update.json. "
              "Software Heritage and APK preservation checks are merged from this workflow run. "
              "This file is the synchronized combined copy."
          )
          aggregate["archive_mode"] = ARCHIVE_MODE
          aggregate["resume_behavior"] = (
              "Each repository/website target stores one current-working-tree TAR.GZ plus a manifest, "
              "checksums and one compact state checkpoint. The APK item stores the current four APK "
              "dependencies with hashes. Git/commit/push history is never archived by Internet Archive. "
              "Wayback is limited to live website URLs; public Git origins are preserved separately by Software Heritage."
          )

          UPDATE_PATH.parent.mkdir(parents=True, exist_ok=True)
          UPDATE_PATH.write_text(
              json.dumps(
                  aggregate,
                  indent=2,
                  ensure_ascii=False,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          readme = (
              README_PATH.read_text(encoding="utf-8")
              if README_PATH.exists()
              else "# Save DedSec Project\n"
          )

          def replace_block(text: str, marker: str, block: str) -> str:
              start = f"<!-- {marker}_START -->"
              end = f"<!-- {marker}_END -->"

              if start in text and end in text:
                  before, remainder = text.split(start, 1)
                  _, after = remainder.split(end, 1)
                  return before.rstrip() + "\n\n" + block + after

              return text.rstrip() + "\n\n" + block + "\n"

          def archive_links_block(all_target_definitions: list[dict]) -> str:
              marker = "PERMANENT_ARCHIVE_LINKS"
              start = f"<!-- {marker}_START -->"
              end = f"<!-- {marker}_END -->"
              lines = [
                  start,
                  "## Permanent Internet Archive Links",
                  "",
              ]

              for target in all_target_definitions:
                  label = target.get("archive_label") or target["title"]
                  ia_url = (
                      "https://archive.org/details/" + target["ia_item"]
                  )
                  lines.append(f"- **{label}:** {ia_url}")

              lines.append(
                  "- **APK dependencies:** "
                  "https://archive.org/details/dedsec1121fk-dedsec-project-apk-backups"
              )

              lines.extend([
                  "",
                  (
                      "This section is regenerated on every archive run from "
                      "the target configuration in "
                      "`.github/workflows/internet-archive.yml`."
                  ),
                  end,
              ])
              return "\n".join(lines)

          def software_heritage_links_block(
              software_state: dict | None,
              all_target_definitions: list[dict],
          ) -> str:
              marker = "SOFTWARE_HERITAGE_LINKS"
              start = f"<!-- {marker}_START -->"
              end = f"<!-- {marker}_END -->"
              records = (software_state or {}).get("repositories", {})
              lines = [
                  start,
                  "## Software Heritage Links",
                  "",
                  (
                      "Software Heritage Save Code Now requests are submitted during one "
                      "workflow run, but their archive links are resolved only on later runs. "
                      "This gives Software Heritage time to ingest each repository before a "
                      "link is published here."
                  ),
                  "",
              ]
              seen: set[str] = set()
              for target in all_target_definitions:
                  repository = str(target.get("repository") or "").strip().strip("/")
                  if not repository or repository in seen:
                      continue
                  seen.add(repository)
                  label = target.get("archive_label") or target.get("title") or repository
                  record = records.get(repository, {}) if isinstance(records, dict) else {}
                  origin = f"https://github.com/{repository}"
                  swhid = str(record.get("snapshot_swhid") or "").strip()
                  if swhid:
                      browse = record.get("browse_url") or (
                          "https://archive.softwareheritage.org/browse/origin/?"
                          + urllib.parse.urlencode({"origin_url": origin})
                      )
                      snapshot_url = str(record.get("snapshot_url") or "").strip() or (
                          f"https://archive.softwareheritage.org/{swhid}/"
                      )
                      line = (
                          f"- **{label}:** [Software Heritage archive]({browse})"
                          f" · [latest snapshot]({snapshot_url})"
                      )
                      visit_status = str(record.get("latest_visit_status") or "").strip()
                      if visit_status:
                          line += f" · `{visit_status}`"
                  elif record.get("save_requested_this_run"):
                      line = (
                          f"- **{label}:** save requested; link will be checked "
                          "on a later workflow run"
                      )
                  elif record.get("awaiting_link_check"):
                      line = f"- **{label}:** waiting for a later Software Heritage link check"
                  elif record:
                      line = f"- **{label}:** no confirmed Software Heritage snapshot yet"
                  else:
                      line = f"- **{label}:** not checked yet"
                  lines.append(line)

              checked = str((software_state or {}).get("checked_at_utc") or "").strip()
              if checked:
                  lines.extend(["", f"Last checked: `{checked}`."])
              lines.extend(["", end])
              return "\n".join(lines)

          def apk_archive_block(apk_state: dict | None) -> str:
              marker = "APK_ARCHIVE_STATUS"
              start = f"<!-- {marker}_START -->"
              end = f"<!-- {marker}_END -->"
              state = apk_state or {}
              files = state.get("files", {}) if isinstance(state.get("files"), dict) else {}
              lines = [
                  start,
                  "## APK Preservation",
                  "",
                  (
                      "The same four APK dependencies used by the local `Settings.py` "
                      "Save DedSec Project backup are checked on every workflow run."
                  ),
                  "",
                  "- [Internet Archive APK collection](https://archive.org/details/dedsec1121fk-dedsec-project-apk-backups)",
              ]
              for filename in ("F-Droid.apk", "Termux.apk", "Termux_API.apk", "Termux_Styling.apk"):
                  metadata = files.get(filename, {}) if isinstance(files, dict) else {}
                  if metadata:
                      lines.append(
                          f"- **{filename}:** `{metadata.get('sha256', 'unknown')}` "
                          f"({metadata.get('size', 0)} bytes)"
                      )
                  else:
                      lines.append(f"- **{filename}:** checked by the workflow")
              checked = str(state.get("checked_at_utc") or "").strip()
              if checked:
                  lines.extend(["", f"Last checked: `{checked}`."])
              lines.extend(["", end])
              return "\n".join(lines)

          def status_block(state: dict) -> str:
              target = state["target"]
              marker = target["marker"]
              start = f"<!-- {marker}_START -->"
              end = f"<!-- {marker}_END -->"
              current = state.get("current_run", {})
              result = state.get("last_result", {})
              wayback = state.get("wayback", {})
              ia_url = "https://archive.org/details/" + target["ia_item"]

              changed = result.get(
                  "changed_or_added_files",
                  result.get("uploaded_new_or_changed", 0),
              )
              lines = [
                  start,
                  f"### {target['title']}",
                  "",
                  (
                      "**Current archive status:** "
                      f"`{current.get('status', 'not_started')}`  "
                  ),
                  (
                      "**Last complete or attempted save:** "
                      f"{state.get('last_completed_at_greece') or 'Not completed yet'}  "
                  ),
                  f"**Current working-tree files:** {len(state.get('files', {}))}  ",
                  (
                      "**Latest working-tree change:** "
                      f"{changed} changed/added, "
                      f"{result.get('deleted_from_repository', 0)} deleted, "
                      f"{result.get('unchanged_files', 0)} unchanged.  "
                  ),
                  (
                      "**Compact archive uploaded this run:** "
                      f"`{result.get('archive_uploaded', False)}`  "
                  ),
                  (
                      "**Archive verification:** "
                      f"`{result.get('mirror_verified', False)}`  "
                  ),
                  (
                      "**Scheduled time(s):** "
                      f"{target['window']}  "
                  ),
                  (
                      "**Archive mode:** One current `current-working-tree.tar.gz` "
                      "plus manifest/checksums/state; `.git`, commits and push history "
                      "are excluded."
                  ),
              ]

              cleanup_pending = result.get("history_cleanup_pending", 0)
              if cleanup_pending:
                  lines.append(
                      f"**Historical cleanup still pending:** {cleanup_pending} object(s).  "
                  )

              legacy_mirrors = result.get("legacy_mirror_objects_visible")
              if isinstance(legacy_mirrors, int) and legacy_mirrors > 0:
                  lines.append(
                      f"**Legacy pre-migration mirror objects still visible:** {legacy_mirrors}. "
                      "They are frozen and are not used for future backups.  "
                  )

              if target.get("kind") == "website":
                  lines.extend([
                      f"**Wayback queue remaining:** {len(wayback.get('pending', []))}  ",
                      f"**Wayback captures accepted:** {wayback.get('completed', 0)}  ",
                  ])

              lines.extend([
                  "",
                  f"- [Internet Archive working-tree archive]({ia_url})",
              ])

              if target.get("kind") == "website":
                  for site in target.get("sites", []):
                      lines.append(
                          f"- [{site} Wayback history]"
                          f"(https://web.archive.org/web/*/{site}/*)"
                      )

              lines.extend([
                  "",
                  "This section is generated from `update.json`.",
                  end,
              ])
              return "\n".join(lines)

          readme = replace_block(
              readme,
              "PERMANENT_ARCHIVE_LINKS",
              archive_links_block(all_targets),
          )
          readme = replace_block(
              readme,
              "SOFTWARE_HERITAGE_LINKS",
              software_heritage_links_block(
                  aggregate.get("software_heritage"),
                  all_targets,
              ),
          )
          readme = replace_block(
              readme,
              "APK_ARCHIVE_STATUS",
              apk_archive_block(aggregate.get("apks")),
          )

          for state in refreshed.values():
              marker = state.get("target", {}).get("marker")
              if marker:
                  readme = replace_block(
                      readme,
                      marker,
                      status_block(state),
                  )

          README_PATH.write_text(readme, encoding="utf-8")
          PY

      - name: Commit state and README
        shell: bash
        run: |
          set -euo pipefail

          git -C controller config user.name "github-actions[bot]"
          git -C controller config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C controller add \
            update.json \
            README.md

          if git -C controller diff --cached --quiet; then
            echo "State and README are already current."
          else
            git -C controller commit \
              -m "chore: update archive state [skip ci]"
            git -C controller push
          fi
