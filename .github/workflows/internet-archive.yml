name: Archive Entire DedSec Ecosystem

on:
  schedule:
    # Wednesday, Friday, Sunday — Greece local time.
    - cron: "0 8 * * 0,3,5"
      timezone: "Europe/Athens"
    - cron: "50 13 * * 0,3,5"
      timezone: "Europe/Athens"
    - cron: "30 19 * * 0,3,5"
      timezone: "Europe/Athens"

  workflow_dispatch:
    inputs:
      group:
        description: Archive group to run
        required: true
        default: all
        type: choice
        options:
          - all
          - dedsec-project
          - websites
          - other-projects

permissions:
  contents: write

concurrency:
  group: dedsec-archive-${{ github.event.schedule || inputs.group || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select scheduled archive group
    runs-on: ubuntu-latest
    outputs:
      run_websites: ${{ steps.plan.outputs.run_websites }}
      repository_count: ${{ steps.plan.outputs.repository_count }}
      repository_matrix: ${{ steps.plan.outputs.repository_matrix }}
      group_name: ${{ steps.plan.outputs.group_name }}

    steps:
      - name: Build archive plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os

          dedsec = [
              {
                  "repository": "dedsec1121fk/DedSec",
                  "slug": "dedsec-main",
                  "title": "DedSec Project Main Repository",
                  "marker": "DEDSEC_MAIN_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-project-repository-snapshots",
                  "timeout_minutes": 300,
                  "window": "Wednesday, Friday and Sunday, 08:00–13:00 Europe/Athens",
                  "legacy_prefixes": (
                      "dedsec-main-,"
                      "dedsec-project-repositories-,"
                      "dedsec-main-project-,"
                      "dedsec-complete-archive-"
                  ),
              },
              {
                  "repository": "sal-scar/DedSec",
                  "slug": "dedsec-backup",
                  "title": "DedSec Project Backup Repository",
                  "marker": "DEDSEC_BACKUP_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-project-backup-repository-snapshots",
                  "timeout_minutes": 300,
                  "window": "Wednesday, Friday and Sunday, 08:00–13:00 Europe/Athens",
                  "legacy_prefixes": (
                      "dedsec-backup-,"
                      "dedsec-backup-project-"
                  ),
              },
          ]

          other = [
              {
                  "repository": "dedsec1121fk/dedsec1121fk",
                  "slug": "github-profile",
                  "title": "DedSec GitHub Profile Repository",
                  "marker": "GITHUB_PROFILE_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-github-profile-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Wednesday, Friday and Sunday, 19:30–23:30 Europe/Athens",
                  "legacy_prefixes": "github-profile-",
              },
              {
                  "repository": "dedsec1121fk/Corrupted-Files-Project",
                  "slug": "corrupted-files-project",
                  "title": "Corrupted Files Project",
                  "marker": "CORRUPTED_FILES_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-corrupted-files-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Wednesday, Friday and Sunday, 19:30–23:30 Europe/Athens",
                  "legacy_prefixes": "corrupted-files-project-",
              },
              {
                  "repository": "dedsec1121fk/Pocket-AI",
                  "slug": "pocket-ai",
                  "title": "Pocket AI",
                  "marker": "POCKET_AI_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-pocket-ai-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Wednesday, Friday and Sunday, 19:30–23:30 Europe/Athens",
                  "legacy_prefixes": "pocket-ai-",
              },
              {
                  "repository": "dedsec1121fk/Offline-Survival-Project",
                  "slug": "offline-survival-project",
                  "title": "Offline Survival Project",
                  "marker": "OFFLINE_SURVIVAL_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-offline-survival-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Wednesday, Friday and Sunday, 19:30–23:30 Europe/Athens",
                  "legacy_prefixes": "offline-survival-project-",
              },
          ]

          event_name = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          manual = os.environ.get("MANUAL_GROUP", "all") or "all"

          run_websites = False
          repositories = []
          group_name = "unknown"

          if event_name == "workflow_dispatch":
              group_name = manual
              if manual == "all":
                  run_websites = True
                  repositories = dedsec + other
              elif manual == "dedsec-project":
                  repositories = dedsec
              elif manual == "websites":
                  run_websites = True
              elif manual == "other-projects":
                  repositories = other
              else:
                  raise SystemExit(f"Unknown manual group: {manual}")

          elif schedule == "0 8 * * 0,3,5":
              group_name = "dedsec-project"
              repositories = dedsec

          elif schedule == "50 13 * * 0,3,5":
              group_name = "websites"
              run_websites = True

          elif schedule == "30 19 * * 0,3,5":
              group_name = "other-projects"
              repositories = other

          else:
              raise SystemExit(
                  f"Unrecognized workflow trigger. event={event_name!r}, "
                  f"schedule={schedule!r}"
              )

          matrix = {"include": repositories}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_websites={'true' if run_websites else 'false'}\n")
              output.write(f"repository_count={len(repositories)}\n")
              output.write(
                  "repository_matrix="
                  + json.dumps(matrix, separators=(",", ":"))
                  + "\n"
              )
              output.write(f"group_name={group_name}\n")

          print(
              f"Selected group {group_name!r}: "
              f"websites={run_websites}, repositories={len(repositories)}"
          )
          PY

  archive-websites:
    name: Archive websites and website source
    needs: prepare
    if: needs.prepare.outputs.run_websites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      SOURCE_REPOSITORY: dedsec1121fk/dedsec1121fk.github.io
      SOURCE_SLUG: dedsec-websites
      IA_ITEM_IDENTIFIER: dedsec1121fk-dedsec-website-snapshots
      MAIN_WEBSITE: https://ded-sec.space
      BACKUP_WEBSITE: https://ded-sec.online
      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}

    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: dedsec1121fk/dedsec1121fk.github.io
          path: source
          fetch-depth: 0
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Validate Internet Archive secrets
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${IA_ACCESS_KEY:-}" ]] || {
            echo "::error::Missing Internet_Archive_1. It must contain the Internet Archive S3 access key."
            exit 1
          }

          [[ -n "${IA_SECRET_KEY:-}" ]] || {
            echo "::error::Missing Internet_Archive_2. It must contain the Internet Archive S3 secret key."
            exit 1
          }

          if [[ "$IA_ACCESS_KEY" =~ [[:space:]] || "$IA_SECRET_KEY" =~ [[:space:]] ]]; then
            echo "::error::An Internet Archive secret contains whitespace."
            exit 1
          fi

          echo "::add-mask::$IA_ACCESS_KEY"
          echo "::add-mask::$IA_SECRET_KEY"

      - name: Create complete website source and history backup
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-output

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          commit="$(git -C source rev-parse HEAD)"
          short_sha="${commit:0:12}"

          source_file="${SOURCE_SLUG}-${timestamp}-${short_sha}-source.tar.gz"
          bundle_file="${SOURCE_SLUG}-${timestamp}-${short_sha}-history.bundle"
          manifest_file="${SOURCE_SLUG}-${timestamp}-${short_sha}-manifest.json"
          checksum_file="${SOURCE_SLUG}-${timestamp}-${short_sha}-SHA256SUMS.txt"

          tar \
            --exclude='.git' \
            --exclude='*/.git' \
            -czf "archive-output/${source_file}" \
            -C source .

          git -C source bundle create \
            "${GITHUB_WORKSPACE}/archive-output/${bundle_file}" \
            --all

          SOURCE_FILE="$source_file" \
          BUNDLE_FILE="$bundle_file" \
          MANIFEST_FILE="$manifest_file" \
          CHECKSUM_FILE="$checksum_file" \
          TIMESTAMP="$timestamp" \
          COMMIT="$commit" \
          python <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          output = pathlib.Path("archive-output")
          source_file = output / os.environ["SOURCE_FILE"]
          bundle_file = output / os.environ["BUNDLE_FILE"]

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          raw = subprocess.check_output(
              ["git", "-C", "source", "ls-files", "-z"]
          )
          tracked = [
              item.decode("utf-8", "surrogateescape")
              for item in raw.split(b"\0")
              if item
          ]

          sizes = {}
          for relative in tracked:
              path = pathlib.Path("source") / relative
              if path.is_file():
                  try:
                      sizes[relative] = path.stat().st_size
                  except OSError:
                      pass

          lfs = subprocess.run(
              ["git", "-C", "source", "lfs", "ls-files", "--name-only"],
              text=True,
              capture_output=True,
              check=False,
          )
          lfs_files = [
              line.strip()
              for line in lfs.stdout.splitlines()
              if line.strip()
          ]

          digests = {
              source_file.name: sha256(source_file),
              bundle_file.name: sha256(bundle_file),
          }

          manifest = {
              "archive_type": "Complete DedSec website source and Git history",
              "source_repository": os.environ["SOURCE_REPOSITORY"],
              "source_commit": os.environ["COMMIT"],
              "created_utc": os.environ["TIMESTAMP"],
              "public_websites": [
                  os.environ["MAIN_WEBSITE"],
                  os.environ["BACKUP_WEBSITE"],
              ],
              "source_archive": source_file.name,
              "git_history_bundle": bundle_file.name,
              "tracked_file_count": len(tracked),
              "tracked_files": tracked,
              "working_tree_file_sizes": sizes,
              "git_lfs_files": lfs_files,
              "sha256": digests,
          }

          (output / os.environ["MANIFEST_FILE"]).write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          (output / os.environ["CHECKSUM_FILE"]).write_text(
              "".join(
                  f"{digest}  {filename}\n"
                  for filename, digest in digests.items()
              ),
              encoding="ascii",
          )
          PY

          {
            echo "timestamp=$timestamp"
            echo "commit=$commit"
            echo "short_sha=$short_sha"
            echo "source_file=$source_file"
            echo "bundle_file=$bundle_file"
            echo "manifest_file=$manifest_file"
            echo "checksum_file=$checksum_file"
          } >> "$GITHUB_OUTPUT"

      - name: Upload website backup to Internet Archive
        shell: bash
        run: |
          set -euo pipefail

          upload_file() {
            local path="$1"
            local filename
            filename="$(basename "$path")"

            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --location \
              --retry 6 \
              --retry-all-errors \
              --retry-delay 10 \
              --header "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
              --header "x-amz-auto-make-bucket:1" \
              --header "x-archive-ignore-preexisting-bucket:1" \
              --header "x-archive-queue-derive:0" \
              --header "x-archive-meta-title:DedSec Project Website Snapshots" \
              --header "x-archive-meta-creator:DedSec Project" \
              --header "x-archive-meta-mediatype:software" \
              --header "x-archive-meta-description:Latest complete source and Git-history backup of the DedSec Project main and backup websites." \
              --header "x-archive-meta-subject:DedSec Project; website; source code; Git history; cybersecurity education" \
              --upload-file "$path" \
              "https://s3.us.archive.org/${IA_ITEM_IDENTIFIER}/${filename}"
          }

          upload_file "archive-output/${{ steps.snapshot.outputs.source_file }}"
          upload_file "archive-output/${{ steps.snapshot.outputs.bundle_file }}"
          upload_file "archive-output/${{ steps.snapshot.outputs.manifest_file }}"
          upload_file "archive-output/${{ steps.snapshot.outputs.checksum_file }}"

      - name: Build all website and website-repository Wayback URLs
        id: urls
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import pathlib
          import subprocess
          import urllib.parse

          sites = [
              os.environ["MAIN_WEBSITE"].rstrip("/"),
              os.environ["BACKUP_WEBSITE"].rstrip("/"),
          ]
          repository = os.environ["SOURCE_REPOSITORY"]
          commit = subprocess.check_output(
              ["git", "-C", "source", "rev-parse", "HEAD"],
              text=True,
          ).strip()

          raw = subprocess.check_output(
              ["git", "-C", "source", "ls-files", "-z"]
          )
          paths = [
              item.decode("utf-8", "surrogateescape")
              for item in raw.split(b"\0")
              if item
          ]

          excluded_prefixes = (".git/", ".github/")
          excluded_names = {
              ".gitignore",
              ".gitattributes",
              ".nojekyll",
              "README",
              "README.md",
              "README.txt",
              "LICENSE",
              "LICENSE.md",
              "LICENSE.txt",
              "SECURITY.md",
          }

          urls = set()

          for site in sites:
              urls.add(site + "/")

          github = f"https://github.com/{repository}"
          raw_github = f"https://raw.githubusercontent.com/{repository}"

          urls.update({
              github,
              f"{github}/commit/{commit}",
              f"{github}/tree/{commit}",
              f"{github}/branches",
              f"{github}/tags",
              f"{github}/releases",
              f"{github}/archive/{commit}.zip",
              f"{github}/archive/{commit}.tar.gz",
          })

          for path in paths:
              normalized = path.replace("\\", "/").lstrip("/")
              if not normalized:
                  continue

              encoded = urllib.parse.quote(
                  normalized,
                  safe="/~._-()",
              )

              if (
                  not normalized.startswith(excluded_prefixes)
                  and normalized not in excluded_names
                  and "/." not in normalized
                  and (pathlib.Path("source") / path).is_file()
              ):
                  for site in sites:
                      urls.add(f"{site}/{encoded}")

                      lower = normalized.lower()
                      if lower == "index.html":
                          urls.add(site + "/")
                      elif lower.endswith("/index.html"):
                          urls.add(
                              f"{site}/{encoded[:-len('index.html')]}"
                          )

              if (pathlib.Path("source") / path).is_file():
                  urls.add(
                      f"{github}/blob/{commit}/{encoded}"
                  )
                  urls.add(
                      f"{raw_github}/{commit}/{encoded}"
                  )

          pathlib.Path("wayback-urls.txt").write_text(
              "\n".join(sorted(urls)) + "\n",
              encoding="utf-8",
          )

          print(f"Prepared {len(urls)} website-related URLs.")
          PY

          echo "count=$(wc -l < wayback-urls.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Submit all website URLs to Wayback Machine
        id: wayback
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          access = os.environ["IA_ACCESS_KEY"]
          secret = os.environ["IA_SECRET_KEY"]

          urls = [
              line.strip()
              for line in pathlib.Path("wayback-urls.txt")
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          ]

          accepted = []
          failures = []

          for number, url in enumerate(urls, start=1):
              payload = urllib.parse.urlencode({
                  "url": url,
                  "capture_outlinks": "0",
                  "capture_screenshot": "0",
                  "skip_first_archive": "0",
              }).encode("utf-8")

              succeeded = False
              last_error = "Unknown error"

              for attempt in range(1, 7):
                  request = urllib.request.Request(
                      "https://web.archive.org/save",
                      data=payload,
                      method="POST",
                      headers={
                          "Authorization": f"LOW {access}:{secret}",
                          "Accept": "application/json",
                          "User-Agent": "DedSec-Website-Archive/4.0",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120,
                      ) as response:
                          body = response.read().decode(
                              "utf-8",
                              "replace",
                          )
                          try:
                              result = json.loads(body)
                          except json.JSONDecodeError:
                              result = {"response": body[:2000]}

                          accepted.append({
                              "url": url,
                              "http_status": response.status,
                              "result": result,
                          })
                          print(
                              f"[{number}/{len(urls)}] accepted: {url}"
                          )
                          succeeded = True
                          break

                  except urllib.error.HTTPError as error:
                      body = error.read().decode(
                          "utf-8",
                          "replace",
                      )
                      last_error = (
                          f"HTTP {error.code}: {body[:1000]}"
                      )

                      if error.code == 403 and (
                          "InvalidAccessKeyId" in body
                          or "SignatureDoesNotMatch" in body
                      ):
                          raise SystemExit(
                              "Internet Archive rejected the credentials. "
                              "Internet_Archive_1 must be the S3 access key "
                              "and Internet_Archive_2 the S3 secret key."
                          )

                      if error.code not in {
                          408, 425, 429, 500, 502, 503, 504
                      }:
                          break

                      retry_after = error.headers.get("Retry-After")
                      delay = (
                          int(retry_after)
                          if retry_after and retry_after.isdigit()
                          else min(180, 12 * attempt)
                      )
                      print(
                          f"Retry {attempt}/6 in {delay}s: {url}"
                      )
                      time.sleep(delay)

                  except Exception as error:
                      last_error = repr(error)
                      delay = min(180, 12 * attempt)
                      print(
                          f"Retry {attempt}/6 in {delay}s: {url}"
                      )
                      time.sleep(delay)

              if not succeeded:
                  failures.append({
                      "url": url,
                      "error": last_error,
                  })
                  print(
                      f"::warning title=Wayback capture failed::"
                      f"{url} — {last_error}"
                  )

              time.sleep(0.7 + random.random() * 0.5)

          report = {
              "submitted_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime(),
              ),
              "requested": len(urls),
              "accepted": len(accepted),
              "failed": len(failures),
              "accepted_requests": accepted,
              "failures": failures,
          }

          pathlib.Path("wayback-report.json").write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False,
              ) + "\n",
              encoding="utf-8",
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"requested={len(urls)}\n")
              output.write(f"accepted={len(accepted)}\n")
              output.write(f"failed={len(failures)}\n")

          if urls and not accepted:
              raise SystemExit(
                  "Every website Wayback submission failed."
              )
          PY

      - name: Upload website Wayback report
        id: report
        shell: bash
        run: |
          set -euo pipefail

          report_name="${SOURCE_SLUG}-${{ steps.snapshot.outputs.timestamp }}-${{ steps.snapshot.outputs.short_sha }}-wayback-report.json"
          cp wayback-report.json "$report_name"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            --header "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
            --header "x-amz-auto-make-bucket:1" \
            --header "x-archive-ignore-preexisting-bucket:1" \
            --header "x-archive-queue-derive:0" \
            --upload-file "$report_name" \
            "https://s3.us.archive.org/${IA_ITEM_IDENTIFIER}/${report_name}"

          echo "report_name=$report_name" >> "$GITHUB_OUTPUT"

      - name: Verify newest website files and delete older Internet Archive files
        shell: bash
        env:
          KEEP_FILES: |
            ${{ steps.snapshot.outputs.source_file }}
            ${{ steps.snapshot.outputs.bundle_file }}
            ${{ steps.snapshot.outputs.manifest_file }}
            ${{ steps.snapshot.outputs.checksum_file }}
            ${{ steps.report.outputs.report_name }}
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          item = os.environ["IA_ITEM_IDENTIFIER"]
          access = os.environ["IA_ACCESS_KEY"]
          secret = os.environ["IA_SECRET_KEY"]
          keep = {
              line.strip()
              for line in os.environ["KEEP_FILES"].splitlines()
              if line.strip()
          }

          managed_prefixes = (
              "dedsec-websites-",
              "dedsec-website-source-",
              "dedsec-website-history-",
              "dedsec-complete-archive-",
          )

          def list_files(attempt):
              encoded = urllib.parse.quote(item, safe="")
              url = (
                  f"https://archive.org/metadata/{encoded}"
                  f"?retention={int(time.time())}-{attempt}-{random.random()}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "DedSec-Archive-Retention/2.0",
                  },
              )
              with urllib.request.urlopen(
                  request,
                  timeout=90,
              ) as response:
                  payload = json.load(response)

              return {
                  entry["name"]
                  for entry in payload.get("files", [])
                  if isinstance(entry, dict)
                  and isinstance(entry.get("name"), str)
              }

          visible = set()
          for attempt in range(1, 61):
              try:
                  visible = list_files(attempt)
              except Exception as error:
                  print(
                      f"Metadata attempt {attempt}/60 failed: "
                      f"{error!r}"
                  )
                  time.sleep(10)
                  continue

              missing = keep - visible
              if not missing:
                  break

              print(
                  f"Waiting for newest Internet Archive files. "
                  f"Missing: {sorted(missing)}"
              )
              time.sleep(10)
          else:
              raise SystemExit(
                  "Safety stop: newest website files were not all visible. "
                  "No old files were deleted."
              )

          def canonical(name):
              while name.startswith(".~~"):
                  name = name[3:]
              return name

          old_files = sorted(
              name
              for name in visible
              if name not in keep
              and canonical(name).startswith(managed_prefixes)
          )

          def delete(name):
              url = (
                  "https://s3.us.archive.org/"
                  + urllib.parse.quote(item, safe="")
                  + "/"
                  + urllib.parse.quote(name, safe="/")
              )

              for attempt in range(1, 7):
                  request = urllib.request.Request(
                      url,
                      method="DELETE",
                      headers={
                          "Authorization": (
                              f"LOW {access}:{secret}"
                          ),
                          "x-archive-cascade-delete": "1",
                          "x-archive-keep-old-version": "0",
                          "User-Agent": "DedSec-Archive-Retention/2.0",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120,
                      ) as response:
                          if response.status not in {
                              200, 202, 204
                          }:
                              raise RuntimeError(
                                  f"Unexpected status "
                                  f"{response.status}"
                              )
                      print(f"Deleted old file: {name}")
                      return

                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return
                      if error.code not in {
                          408, 409, 425, 429,
                          500, 502, 503, 504,
                      }:
                          raise
                  time.sleep(min(90, 10 * attempt))

              raise SystemExit(
                  f"Failed to delete old file: {name}"
              )

          for filename in old_files:
              delete(filename)
              time.sleep(0.5)

          print(
              f"Kept {len(keep)} current website files and "
              f"deleted {len(old_files)} older generated files."
          )
          PY

      - name: Create website status record
        shell: bash
        env:
          SAVED_COMMIT: ${{ steps.snapshot.outputs.commit }}
          REQUESTED: ${{ steps.wayback.outputs.requested }}
          ACCEPTED: ${{ steps.wayback.outputs.accepted }}
          FAILED: ${{ steps.wayback.outputs.failed }}
        run: |
          set -euo pipefail
          mkdir -p status

          python <<'PY'
          import json
          import os
          import pathlib
          from datetime import datetime
          from zoneinfo import ZoneInfo

          status = {
              "marker": "WEBSITES_ARCHIVE_STATUS",
              "kind": "websites",
              "title": "Websites and Website Source",
              "saved_greece": datetime.now(
                  ZoneInfo("Europe/Athens")
              ).strftime("%Y-%m-%d %H:%M:%S %Z"),
              "repository": os.environ["SOURCE_REPOSITORY"],
              "commit": os.environ["SAVED_COMMIT"],
              "ia_item": os.environ["IA_ITEM_IDENTIFIER"],
              "requested": int(os.environ["REQUESTED"]),
              "accepted": int(os.environ["ACCEPTED"]),
              "failed": int(os.environ["FAILED"]),
              "window": (
                  "Wednesday, Friday and Sunday, "
                  "13:50–18:50 Europe/Athens"
              ),
              "links": [
                  {
                      "label": "Main website Wayback history",
                      "url": (
                          "https://web.archive.org/web/*/"
                          "https://ded-sec.space/*"
                      ),
                  },
                  {
                      "label": "Backup website Wayback history",
                      "url": (
                          "https://web.archive.org/web/*/"
                          "https://ded-sec.online/*"
                      ),
                  },
                  {
                      "label": "Website repository Wayback history",
                      "url": (
                          "https://web.archive.org/web/*/"
                          "https://github.com/"
                          "dedsec1121fk/dedsec1121fk.github.io*"
                      ),
                  },
              ],
          }

          pathlib.Path("status/websites.json").write_text(
              json.dumps(status, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload website status
        uses: actions/upload-artifact@v4
        with:
          name: archive-status-websites-${{ github.run_id }}
          path: status/websites.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload website reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-archive-reports-${{ github.run_id }}
          path: |
            archive-output/*manifest.json
            archive-output/*SHA256SUMS.txt
            wayback-urls.txt
            wayback-report.json
          if-no-files-found: ignore
          retention-days: 30

  archive-repositories:
    name: Archive ${{ matrix.title }}
    needs: prepare
    if: needs.prepare.outputs.repository_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.repository_matrix) }}

    env:
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_SLUG: ${{ matrix.slug }}
      TARGET_TITLE: ${{ matrix.title }}
      TARGET_MARKER: ${{ matrix.marker }}
      IA_ITEM_IDENTIFIER: ${{ matrix.ia_item }}
      TARGET_WINDOW: ${{ matrix.window }}
      LEGACY_PREFIXES: ${{ matrix.legacy_prefixes }}
      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}

    steps:
      - name: Check out repository and Git LFS files
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: source
          fetch-depth: 0
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Validate Internet Archive secrets
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${IA_ACCESS_KEY:-}" ]] || {
            echo "::error::Missing Internet_Archive_1."
            exit 1
          }

          [[ -n "${IA_SECRET_KEY:-}" ]] || {
            echo "::error::Missing Internet_Archive_2."
            exit 1
          }

          if [[ "$IA_ACCESS_KEY" =~ [[:space:]] || "$IA_SECRET_KEY" =~ [[:space:]] ]]; then
            echo "::error::An Internet Archive secret contains whitespace."
            exit 1
          fi

          echo "::add-mask::$IA_ACCESS_KEY"
          echo "::add-mask::$IA_SECRET_KEY"

      - name: Create complete source and Git-history backup
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-output

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          commit="$(git -C source rev-parse HEAD)"
          short_sha="${commit:0:12}"

          source_file="${TARGET_SLUG}-${timestamp}-${short_sha}-source.tar.gz"
          bundle_file="${TARGET_SLUG}-${timestamp}-${short_sha}-history.bundle"
          manifest_file="${TARGET_SLUG}-${timestamp}-${short_sha}-manifest.json"
          checksum_file="${TARGET_SLUG}-${timestamp}-${short_sha}-SHA256SUMS.txt"

          tar \
            --exclude='.git' \
            --exclude='*/.git' \
            -czf "archive-output/${source_file}" \
            -C source .

          git -C source bundle create \
            "${GITHUB_WORKSPACE}/archive-output/${bundle_file}" \
            --all

          SOURCE_FILE="$source_file" \
          BUNDLE_FILE="$bundle_file" \
          MANIFEST_FILE="$manifest_file" \
          CHECKSUM_FILE="$checksum_file" \
          TIMESTAMP="$timestamp" \
          COMMIT="$commit" \
          python <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          output = pathlib.Path("archive-output")
          source_file = output / os.environ["SOURCE_FILE"]
          bundle_file = output / os.environ["BUNDLE_FILE"]

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          raw = subprocess.check_output(
              ["git", "-C", "source", "ls-files", "-z"]
          )
          tracked = [
              item.decode("utf-8", "surrogateescape")
              for item in raw.split(b"\0")
              if item
          ]

          sizes = {}
          for relative in tracked:
              path = pathlib.Path("source") / relative
              if path.is_file():
                  try:
                      sizes[relative] = path.stat().st_size
                  except OSError:
                      pass

          lfs = subprocess.run(
              ["git", "-C", "source", "lfs", "ls-files", "--name-only"],
              text=True,
              capture_output=True,
              check=False,
          )
          lfs_files = [
              line.strip()
              for line in lfs.stdout.splitlines()
              if line.strip()
          ]

          digests = {
              source_file.name: sha256(source_file),
              bundle_file.name: sha256(bundle_file),
          }

          manifest = {
              "archive_type": "Complete repository source and Git history",
              "repository": os.environ["TARGET_REPOSITORY"],
              "title": os.environ["TARGET_TITLE"],
              "commit": os.environ["COMMIT"],
              "created_utc": os.environ["TIMESTAMP"],
              "source_archive": source_file.name,
              "git_history_bundle": bundle_file.name,
              "tracked_file_count": len(tracked),
              "tracked_files": tracked,
              "working_tree_file_sizes": sizes,
              "git_lfs_files": lfs_files,
              "sha256": digests,
              "restore_command": (
                  f"git clone {bundle_file.name} restored-repository"
              ),
          }

          (output / os.environ["MANIFEST_FILE"]).write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          (output / os.environ["CHECKSUM_FILE"]).write_text(
              "".join(
                  f"{digest}  {filename}\n"
                  for filename, digest in digests.items()
              ),
              encoding="ascii",
          )
          PY

          {
            echo "timestamp=$timestamp"
            echo "commit=$commit"
            echo "short_sha=$short_sha"
            echo "source_file=$source_file"
            echo "bundle_file=$bundle_file"
            echo "manifest_file=$manifest_file"
            echo "checksum_file=$checksum_file"
          } >> "$GITHUB_OUTPUT"

      - name: Upload repository backup to Internet Archive
        shell: bash
        run: |
          set -euo pipefail

          upload_file() {
            local path="$1"
            local filename
            filename="$(basename "$path")"

            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --location \
              --retry 6 \
              --retry-all-errors \
              --retry-delay 10 \
              --header "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
              --header "x-amz-auto-make-bucket:1" \
              --header "x-archive-ignore-preexisting-bucket:1" \
              --header "x-archive-queue-derive:0" \
              --header "x-archive-meta-title:${TARGET_TITLE} Snapshots" \
              --header "x-archive-meta-creator:DedSec Project" \
              --header "x-archive-meta-mediatype:software" \
              --header "x-archive-meta-description:Latest complete source, Git LFS working files, submodules and Git-history backup for ${TARGET_REPOSITORY}." \
              --header "x-archive-meta-subject:DedSec Project; GitHub; source code; Git history; software preservation" \
              --upload-file "$path" \
              "https://s3.us.archive.org/${IA_ITEM_IDENTIFIER}/${filename}"
          }

          upload_file "archive-output/${{ steps.snapshot.outputs.source_file }}"
          upload_file "archive-output/${{ steps.snapshot.outputs.bundle_file }}"
          upload_file "archive-output/${{ steps.snapshot.outputs.manifest_file }}"
          upload_file "archive-output/${{ steps.snapshot.outputs.checksum_file }}"

      - name: Build complete repository Wayback URL list
        id: urls
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import pathlib
          import subprocess
          import urllib.parse

          repository = os.environ["TARGET_REPOSITORY"]
          commit = subprocess.check_output(
              ["git", "-C", "source", "rev-parse", "HEAD"],
              text=True,
          ).strip()

          github = f"https://github.com/{repository}"
          raw_github = f"https://raw.githubusercontent.com/{repository}"

          urls = {
              github,
              f"{github}/commit/{commit}",
              f"{github}/tree/{commit}",
              f"{github}/branches",
              f"{github}/tags",
              f"{github}/releases",
              f"{github}/archive/{commit}.zip",
              f"{github}/archive/{commit}.tar.gz",
          }

          raw = subprocess.check_output(
              ["git", "-C", "source", "ls-files", "-z"]
          )
          paths = [
              item.decode("utf-8", "surrogateescape")
              for item in raw.split(b"\0")
              if item
          ]

          for path in paths:
              normalized = path.replace("\\", "/").lstrip("/")
              if not normalized:
                  continue
              if not (pathlib.Path("source") / path).is_file():
                  continue

              encoded = urllib.parse.quote(
                  normalized,
                  safe="/~._-()",
              )

              urls.add(
                  f"{github}/blob/{commit}/{encoded}"
              )
              urls.add(
                  f"{raw_github}/{commit}/{encoded}"
              )

          pathlib.Path("wayback-urls.txt").write_text(
              "\n".join(sorted(urls)) + "\n",
              encoding="utf-8",
          )

          print(f"Prepared {len(urls)} URLs for {repository}.")
          PY

          echo "count=$(wc -l < wayback-urls.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Submit all repository URLs to Wayback Machine
        id: wayback
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          access = os.environ["IA_ACCESS_KEY"]
          secret = os.environ["IA_SECRET_KEY"]

          urls = [
              line.strip()
              for line in pathlib.Path("wayback-urls.txt")
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          ]

          accepted = []
          failures = []

          for number, url in enumerate(urls, start=1):
              payload = urllib.parse.urlencode({
                  "url": url,
                  "capture_outlinks": "0",
                  "capture_screenshot": "0",
                  "skip_first_archive": "0",
              }).encode("utf-8")

              succeeded = False
              last_error = "Unknown error"

              for attempt in range(1, 7):
                  request = urllib.request.Request(
                      "https://web.archive.org/save",
                      data=payload,
                      method="POST",
                      headers={
                          "Authorization": f"LOW {access}:{secret}",
                          "Accept": "application/json",
                          "User-Agent": "DedSec-Repository-Archive/4.0",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120,
                      ) as response:
                          body = response.read().decode(
                              "utf-8",
                              "replace",
                          )
                          try:
                              result = json.loads(body)
                          except json.JSONDecodeError:
                              result = {"response": body[:2000]}

                          accepted.append({
                              "url": url,
                              "http_status": response.status,
                              "result": result,
                          })
                          print(
                              f"[{number}/{len(urls)}] accepted: {url}"
                          )
                          succeeded = True
                          break

                  except urllib.error.HTTPError as error:
                      body = error.read().decode(
                          "utf-8",
                          "replace",
                      )
                      last_error = (
                          f"HTTP {error.code}: {body[:1000]}"
                      )

                      if error.code == 403 and (
                          "InvalidAccessKeyId" in body
                          or "SignatureDoesNotMatch" in body
                      ):
                          raise SystemExit(
                              "Internet Archive rejected the credentials. "
                              "Internet_Archive_1 must be the S3 access key "
                              "and Internet_Archive_2 the S3 secret key."
                          )

                      if error.code not in {
                          408, 425, 429, 500, 502, 503, 504
                      }:
                          break

                      retry_after = error.headers.get("Retry-After")
                      delay = (
                          int(retry_after)
                          if retry_after and retry_after.isdigit()
                          else min(180, 12 * attempt)
                      )
                      print(
                          f"Retry {attempt}/6 in {delay}s: {url}"
                      )
                      time.sleep(delay)

                  except Exception as error:
                      last_error = repr(error)
                      delay = min(180, 12 * attempt)
                      print(
                          f"Retry {attempt}/6 in {delay}s: {url}"
                      )
                      time.sleep(delay)

              if not succeeded:
                  failures.append({
                      "url": url,
                      "error": last_error,
                  })
                  print(
                      f"::warning title=Wayback capture failed::"
                      f"{url} — {last_error}"
                  )

              time.sleep(0.7 + random.random() * 0.5)

          report = {
              "repository": os.environ["TARGET_REPOSITORY"],
              "submitted_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime(),
              ),
              "requested": len(urls),
              "accepted": len(accepted),
              "failed": len(failures),
              "accepted_requests": accepted,
              "failures": failures,
          }

          pathlib.Path("wayback-report.json").write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False,
              ) + "\n",
              encoding="utf-8",
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"requested={len(urls)}\n")
              output.write(f"accepted={len(accepted)}\n")
              output.write(f"failed={len(failures)}\n")

          if urls and not accepted:
              raise SystemExit(
                  "Every repository Wayback submission failed."
              )
          PY

      - name: Upload repository Wayback report
        id: report
        shell: bash
        run: |
          set -euo pipefail

          report_name="${TARGET_SLUG}-${{ steps.snapshot.outputs.timestamp }}-${{ steps.snapshot.outputs.short_sha }}-wayback-report.json"
          cp wayback-report.json "$report_name"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            --header "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
            --header "x-amz-auto-make-bucket:1" \
            --header "x-archive-ignore-preexisting-bucket:1" \
            --header "x-archive-queue-derive:0" \
            --upload-file "$report_name" \
            "https://s3.us.archive.org/${IA_ITEM_IDENTIFIER}/${report_name}"

          echo "report_name=$report_name" >> "$GITHUB_OUTPUT"

      - name: Create repository result record
        shell: bash
        env:
          SAVED_COMMIT: ${{ steps.snapshot.outputs.commit }}
          SOURCE_FILE: ${{ steps.snapshot.outputs.source_file }}
          BUNDLE_FILE: ${{ steps.snapshot.outputs.bundle_file }}
          MANIFEST_FILE: ${{ steps.snapshot.outputs.manifest_file }}
          CHECKSUM_FILE: ${{ steps.snapshot.outputs.checksum_file }}
          REPORT_FILE: ${{ steps.report.outputs.report_name }}
          REQUESTED: ${{ steps.wayback.outputs.requested }}
          ACCEPTED: ${{ steps.wayback.outputs.accepted }}
          FAILED: ${{ steps.wayback.outputs.failed }}
        run: |
          set -euo pipefail
          mkdir -p result

          python <<'PY'
          import json
          import os
          import pathlib
          from datetime import datetime
          from zoneinfo import ZoneInfo

          result = {
              "marker": os.environ["TARGET_MARKER"],
              "kind": "repository",
              "slug": os.environ["TARGET_SLUG"],
              "title": os.environ["TARGET_TITLE"],
              "repository": os.environ["TARGET_REPOSITORY"],
              "saved_greece": datetime.now(
                  ZoneInfo("Europe/Athens")
              ).strftime("%Y-%m-%d %H:%M:%S %Z"),
              "commit": os.environ["SAVED_COMMIT"],
              "ia_item": os.environ["IA_ITEM_IDENTIFIER"],
              "requested": int(os.environ["REQUESTED"]),
              "accepted": int(os.environ["ACCEPTED"]),
              "failed": int(os.environ["FAILED"]),
              "window": os.environ["TARGET_WINDOW"],
              "keep_files": [
                  os.environ["SOURCE_FILE"],
                  os.environ["BUNDLE_FILE"],
                  os.environ["MANIFEST_FILE"],
                  os.environ["CHECKSUM_FILE"],
                  os.environ["REPORT_FILE"],
              ],
              "managed_prefixes": [
                  prefix.strip()
                  for prefix in (
                      os.environ["TARGET_SLUG"] + ","
                      + os.environ["LEGACY_PREFIXES"]
                  ).split(",")
                  if prefix.strip()
              ],
              "ia_url": (
                  "https://archive.org/details/"
                  + os.environ["IA_ITEM_IDENTIFIER"]
              ),
              "wayback_url": (
                  "https://web.archive.org/web/*/"
                  "https://github.com/"
                  + os.environ["TARGET_REPOSITORY"]
                  + "*"
              ),
          }

          filename = (
              "result/"
              + os.environ["TARGET_SLUG"]
              + ".json"
          )
          pathlib.Path(filename).write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload repository result record
        uses: actions/upload-artifact@v4
        with:
          name: archive-result-${{ matrix.slug }}-${{ github.run_id }}
          path: result/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload repository reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-reports-${{ matrix.slug }}-${{ github.run_id }}
          path: |
            archive-output/*manifest.json
            archive-output/*SHA256SUMS.txt
            wayback-urls.txt
            wayback-report.json
          if-no-files-found: ignore
          retention-days: 30

  finalize-repositories:
    name: Verify repository uploads and delete older archives
    needs:
      - prepare
      - archive-repositories
    if: |
      always() &&
      needs.prepare.outputs.repository_count != '0' &&
      needs.archive-repositories.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}

    steps:
      - name: Download successful repository result records
        uses: actions/download-artifact@v4
        with:
          pattern: archive-result-*-${{ github.run_id }}
          path: results
          merge-multiple: true

      - name: Verify newest files and delete older generated files
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          access = os.environ["IA_ACCESS_KEY"]
          secret = os.environ["IA_SECRET_KEY"]

          result_files = sorted(
              pathlib.Path("results").glob("*.json")
          )

          if not result_files:
              raise SystemExit(
                  "No repository result records were downloaded."
              )

          def list_files(item, attempt):
              encoded = urllib.parse.quote(item, safe="")
              url = (
                  f"https://archive.org/metadata/{encoded}"
                  f"?retention={int(time.time())}-{attempt}-{random.random()}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "DedSec-Archive-Retention/2.0",
                  },
              )
              with urllib.request.urlopen(
                  request,
                  timeout=90,
              ) as response:
                  payload = json.load(response)

              return {
                  entry["name"]
                  for entry in payload.get("files", [])
                  if isinstance(entry, dict)
                  and isinstance(entry.get("name"), str)
              }

          def canonical(name):
              while name.startswith(".~~"):
                  name = name[3:]
              return name

          def delete(item, name):
              url = (
                  "https://s3.us.archive.org/"
                  + urllib.parse.quote(item, safe="")
                  + "/"
                  + urllib.parse.quote(name, safe="/")
              )

              for attempt in range(1, 7):
                  request = urllib.request.Request(
                      url,
                      method="DELETE",
                      headers={
                          "Authorization": (
                              f"LOW {access}:{secret}"
                          ),
                          "x-archive-cascade-delete": "1",
                          "x-archive-keep-old-version": "0",
                          "User-Agent": "DedSec-Archive-Retention/2.0",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120,
                      ) as response:
                          if response.status not in {
                              200, 202, 204
                          }:
                              raise RuntimeError(
                                  f"Unexpected status "
                                  f"{response.status}"
                              )
                      print(
                          f"{item}: deleted old file {name}"
                      )
                      return

                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return
                      if error.code not in {
                          408, 409, 425, 429,
                          500, 502, 503, 504,
                      }:
                          raise

                  time.sleep(min(90, 10 * attempt))

              raise SystemExit(
                  f"Failed to delete {name!r} from {item}."
              )

          summaries = []

          for result_file in result_files:
              result = json.loads(
                  result_file.read_text(encoding="utf-8")
              )
              item = result["ia_item"]
              keep = set(result["keep_files"])
              prefixes = tuple(result["managed_prefixes"])

              visible = set()
              for attempt in range(1, 61):
                  try:
                      visible = list_files(item, attempt)
                  except Exception as error:
                      print(
                          f"{item}: metadata attempt "
                          f"{attempt}/60 failed: {error!r}"
                      )
                      time.sleep(10)
                      continue

                  missing = keep - visible
                  if not missing:
                      break

                  print(
                      f"{item}: waiting for newest files. "
                      f"Missing: {sorted(missing)}"
                  )
                  time.sleep(10)
              else:
                  raise SystemExit(
                      f"Safety stop for {item}: newest files "
                      "were not all visible. No old files "
                      "were deleted from this item."
                  )

              old_files = sorted(
                  name
                  for name in visible
                  if name not in keep
                  and canonical(name).startswith(prefixes)
              )

              for name in old_files:
                  delete(item, name)
                  time.sleep(0.5)

              summaries.append({
                  "title": result["title"],
                  "item": item,
                  "kept": len(keep),
                  "deleted": len(old_files),
              })

          summary_path = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )
          if summary_path:
              with open(
                  summary_path,
                  "a",
                  encoding="utf-8",
              ) as output:
                  output.write(
                      "## Repository archive retention\n\n"
                  )
                  for summary in summaries:
                      output.write(
                          f"- **{summary['title']}**: "
                          f"kept {summary['kept']} current "
                          f"files and deleted "
                          f"{summary['deleted']} older "
                          f"generated files.\n"
                      )
          PY

      - name: Publish finalized repository status records
        uses: actions/upload-artifact@v4
        with:
          name: archive-status-repositories-${{ github.run_id }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 7

  update-readme:
    name: Update README archive links and timestamps
    needs:
      - prepare
      - archive-websites
      - finalize-repositories
    if: |
      always() &&
      (
        needs.archive-websites.result == 'success' ||
        needs.finalize-repositories.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out archive controller repository
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0

      - name: Download finalized status records
        uses: actions/download-artifact@v4
        with:
          pattern: archive-status-*-${{ github.run_id }}
          path: statuses
          merge-multiple: true

      - name: Update marked README sections
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib

          readme_path = pathlib.Path(
              "controller/README.md"
          )

          if readme_path.exists():
              readme = readme_path.read_text(
                  encoding="utf-8"
              )
          else:
              readme = "# Save DedSec Project\n"

          status_files = sorted(
              pathlib.Path("statuses").glob("*.json")
          )

          if not status_files:
              raise SystemExit(
                  "No finalized archive status records found."
              )

          def build_block(status):
              marker = status["marker"]
              start = f"<!-- {marker}_START -->"
              end = f"<!-- {marker}_END -->"
              commit = status["commit"]
              repo = status["repository"]
              ia_url = (
                  "https://archive.org/details/"
                  + status["ia_item"]
              )

              if status["kind"] == "websites":
                  links = "\n".join(
                      f"- [{entry['label']}]"
                      f"({entry['url']})"
                      for entry in status["links"]
                  )
                  title = "### Websites and Website Source"
              else:
                  links = (
                      f"- [Wayback Machine capture history]"
                      f"({status['wayback_url']})"
                  )
                  title = f"### {status['title']}"

              return (
                  f"{start}\n"
                  f"{title}\n\n"
                  f"**Last successfully saved:** "
                  f"{status['saved_greece']} "
                  f"(Greece time)  \n"
                  f"**Archived commit:** "
                  f"[`{commit[:12]}`]"
                  f"(https://github.com/{repo}/commit/{commit})  \n"
                  f"**Wayback accepted:** "
                  f"{status['accepted']}/{status['requested']}  \n"
                  f"**Wayback failures:** "
                  f"{status['failed']}  \n"
                  f"**Scheduled window:** "
                  f"{status['window']}  \n"
                  f"**Internet Archive retention:** "
                  f"Newest successful snapshot set only.\n\n"
                  f"- [Internet Archive saved files]"
                  f"({ia_url})\n"
                  f"{links}\n\n"
                  f"This section is updated automatically "
                  f"after upload verification and cleanup.\n"
                  f"{end}"
              )

          for status_file in status_files:
              status = json.loads(
                  status_file.read_text(
                      encoding="utf-8"
                  )
              )
              marker = status["marker"]
              start = f"<!-- {marker}_START -->"
              end = f"<!-- {marker}_END -->"
              block = build_block(status)

              if start in readme and end in readme:
                  before, remainder = readme.split(
                      start,
                      1,
                  )
                  _, after = remainder.split(
                      end,
                      1,
                  )
                  readme = (
                      before.rstrip()
                      + "\n\n"
                      + block
                      + after
                  )
              else:
                  readme = (
                      readme.rstrip()
                      + "\n\n"
                      + block
                      + "\n"
                  )

          readme_path.write_text(
              readme,
              encoding="utf-8",
          )
          PY

      - name: Commit README update
        shell: bash
        run: |
          set -euo pipefail

          git -C controller config \
            user.name "github-actions[bot]"

          git -C controller config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C controller add README.md

          if git -C controller diff --cached --quiet; then
            echo "README already contains the current status."
          else
            git -C controller commit \
              -m "docs: update archive status [skip ci]"

            git -C controller push
          fi
