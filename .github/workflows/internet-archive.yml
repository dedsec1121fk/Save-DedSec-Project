name: Incrementally Archive Entire DedSec Ecosystem

on:
  schedule:
    # Wednesday, Friday and Sunday — Greece local time.
    - cron: "0 8 * * 0,3,5"
      timezone: "Europe/Athens"
    - cron: "50 13 * * 0,3,5"
      timezone: "Europe/Athens"
    - cron: "30 19 * * 0,3,5"
      timezone: "Europe/Athens"

  workflow_dispatch:
    inputs:
      group:
        description: Archive group to run
        required: true
        default: all
        type: choice
        options:
          - all
          - dedsec-project
          - websites
          - other-projects

permissions:
  contents: write

concurrency:
  group: dedsec-incremental-archive-${{ github.event.schedule || inputs.group || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select archive targets
    runs-on: ubuntu-latest

    outputs:
      target_count: ${{ steps.plan.outputs.target_count }}
      target_matrix: ${{ steps.plan.outputs.target_matrix }}
      selected_targets: ${{ steps.plan.outputs.selected_targets }}
      group_name: ${{ steps.plan.outputs.group_name }}

    steps:
      - name: Build archive plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os

          dedsec_targets = [
              {
                  "repository": "dedsec1121fk/DedSec",
                  "slug": "dedsec-main",
                  "title": "DedSec Project Main Repository",
                  "marker": "DEDSEC_MAIN_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-project-repository-snapshots",
                  "timeout_minutes": 300,
                  "window": "Wednesday, Friday and Sunday, 08:00–13:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": (
                      "dedsec-main-,"
                      "dedsec-project-repositories-,"
                      "dedsec-main-project-,"
                      "dedsec-backup-,"
                      "dedsec-backup-project-,"
                      "dedsec-complete-archive-"
                  ),
              },
              {
                  "repository": "sal-scar/DedSec",
                  "slug": "dedsec-backup",
                  "title": "DedSec Project Backup Repository",
                  "marker": "DEDSEC_BACKUP_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-project-backup-repository-snapshots",
                  "timeout_minutes": 300,
                  "window": "Wednesday, Friday and Sunday, 08:00–13:00 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": (
                      "dedsec-backup-,"
                      "dedsec-backup-project-"
                  ),
              },
          ]

          website_targets = [
              {
                  "repository": "dedsec1121fk/dedsec1121fk.github.io",
                  "slug": "dedsec-websites",
                  "title": "DedSec Websites and Website Source",
                  "marker": "WEBSITES_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-dedsec-website-snapshots",
                  "timeout_minutes": 300,
                  "window": "Wednesday, Friday and Sunday, 13:50–18:50 Europe/Athens",
                  "kind": "website",
                  "sites": "https://ded-sec.space|https://ded-sec.online",
                  "legacy_prefixes": (
                      "dedsec-websites-,"
                      "dedsec-website-source-,"
                      "dedsec-website-history-,"
                      "dedsec-complete-archive-"
                  ),
              },
          ]

          other_targets = [
              {
                  "repository": "dedsec1121fk/dedsec1121fk",
                  "slug": "github-profile",
                  "title": "DedSec GitHub Profile Repository",
                  "marker": "GITHUB_PROFILE_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-github-profile-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Wednesday, Friday and Sunday, 19:30–23:30 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "github-profile-",
              },
              {
                  "repository": "dedsec1121fk/Corrupted-Files-Project",
                  "slug": "corrupted-files-project",
                  "title": "Corrupted Files Project",
                  "marker": "CORRUPTED_FILES_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-corrupted-files-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Wednesday, Friday and Sunday, 19:30–23:30 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "corrupted-files-project-",
              },
              {
                  "repository": "dedsec1121fk/Pocket-AI",
                  "slug": "pocket-ai",
                  "title": "Pocket AI",
                  "marker": "POCKET_AI_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-pocket-ai-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Wednesday, Friday and Sunday, 19:30–23:30 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "pocket-ai-",
              },
              {
                  "repository": "dedsec1121fk/Offline-Survival-Project",
                  "slug": "offline-survival-project",
                  "title": "Offline Survival Project",
                  "marker": "OFFLINE_SURVIVAL_ARCHIVE_STATUS",
                  "ia_item": "dedsec1121fk-offline-survival-project-repository-snapshots",
                  "timeout_minutes": 240,
                  "window": "Wednesday, Friday and Sunday, 19:30–23:30 Europe/Athens",
                  "kind": "repository",
                  "sites": "",
                  "legacy_prefixes": "offline-survival-project-",
              },
          ]

          event_name = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          manual_group = os.environ.get("MANUAL_GROUP", "") or "all"

          if event_name == "workflow_dispatch":
              group_name = manual_group
              if manual_group == "all":
                  targets = (
                      dedsec_targets
                      + website_targets
                      + other_targets
                  )
              elif manual_group == "dedsec-project":
                  targets = dedsec_targets
              elif manual_group == "websites":
                  targets = website_targets
              elif manual_group == "other-projects":
                  targets = other_targets
              else:
                  raise SystemExit(
                      f"Unknown manual group: {manual_group}"
                  )

          elif schedule == "0 8 * * 0,3,5":
              group_name = "dedsec-project"
              targets = dedsec_targets

          elif schedule == "50 13 * * 0,3,5":
              group_name = "websites"
              targets = website_targets

          elif schedule == "30 19 * * 0,3,5":
              group_name = "other-projects"
              targets = other_targets

          else:
              raise SystemExit(
                  f"Unrecognized trigger: event={event_name!r}, "
                  f"schedule={schedule!r}"
              )

          matrix = {"include": targets}

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"target_count={len(targets)}\n")
              output.write(
                  "target_matrix="
                  + json.dumps(
                      matrix,
                      separators=(",", ":"),
                  )
                  + "\n"
              )
              output.write(
                  "selected_targets="
                  + json.dumps(
                      targets,
                      separators=(",", ":"),
                  )
                  + "\n"
              )
              output.write(f"group_name={group_name}\n")

          print(
              f"Selected {len(targets)} targets "
              f"for group {group_name!r}."
          )
          PY

  archive-targets:
    name: Sync ${{ matrix.title }}
    needs: prepare
    if: needs.prepare.outputs.target_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.target_matrix) }}

    env:
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_SLUG: ${{ matrix.slug }}
      TARGET_TITLE: ${{ matrix.title }}
      TARGET_MARKER: ${{ matrix.marker }}
      TARGET_KIND: ${{ matrix.kind }}
      TARGET_SITES: ${{ matrix.sites }}
      TARGET_WINDOW: ${{ matrix.window }}
      IA_ITEM_IDENTIFIER: ${{ matrix.ia_item }}
      LEGACY_PREFIXES: ${{ matrix.legacy_prefixes }}

      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}

    steps:
      - name: Check out archive controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0

      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: source
          fetch-depth: 0
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Internet Archive secrets
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${IA_ACCESS_KEY:-}" ]] || {
            echo "::error::Missing Internet_Archive_1. It must contain the Internet Archive S3 access key."
            exit 1
          }

          [[ -n "${IA_SECRET_KEY:-}" ]] || {
            echo "::error::Missing Internet_Archive_2. It must contain the Internet Archive S3 secret key."
            exit 1
          }

          if [[ "$IA_ACCESS_KEY" =~ [[:space:]] || "$IA_SECRET_KEY" =~ [[:space:]] ]]; then
            echo "::error::An Internet Archive secret contains whitespace."
            exit 1
          fi

          echo "::add-mask::$IA_ACCESS_KEY"
          echo "::add-mask::$IA_SECRET_KEY"

      - name: Stagger parallel Internet Archive requests
        shell: bash
        run: |
          set -euo pipefail

          delay="$(
            TARGET_SLUG="$TARGET_SLUG" python - <<'PY'
          import hashlib
          import os
          import time

          slug = os.environ["TARGET_SLUG"]
          seed = int(hashlib.sha256(slug.encode()).hexdigest()[:8], 16)
          # Stable spread between targets plus a small time-dependent component.
          print(5 + (seed % 41) + (int(time.time()) % 7))
          PY
          )"

          echo "Waiting ${delay}s before contacting Internet Archive."
          sleep "$delay"

      - name: Incrementally synchronize Internet Archive and Wayback
        id: sync
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          python <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import pathlib
          import random
          import shutil
          import stat
          import subprocess
          import tempfile
          import time
          import traceback
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          SCHEMA_VERSION = 4
          SOURCE_ROOT = pathlib.Path("source")
          CONTROLLER_ROOT = pathlib.Path("controller")
          CONTROLLER_STATE_PATH = (
              CONTROLLER_ROOT
              / ".github"
              / "workflows"
              / "update.json"
          )
          LOCAL_STATE_DIR = pathlib.Path("archive-state")
          LOCAL_STATE_PATH = (
              LOCAL_STATE_DIR
              / f"{os.environ['TARGET_SLUG']}.json"
          )
          IA_STATE_NAME = "archive-state/update.json"

          REPOSITORY = os.environ["TARGET_REPOSITORY"]
          SLUG = os.environ["TARGET_SLUG"]
          TITLE = os.environ["TARGET_TITLE"]
          MARKER = os.environ["TARGET_MARKER"]
          KIND = os.environ["TARGET_KIND"]
          SITES = [
              site.strip().rstrip("/")
              for site in os.environ.get(
                  "TARGET_SITES",
                  "",
              ).split("|")
              if site.strip()
          ]
          WINDOW = os.environ["TARGET_WINDOW"]
          ITEM = os.environ["IA_ITEM_IDENTIFIER"]
          ACCESS_KEY = os.environ["IA_ACCESS_KEY"]
          SECRET_KEY = os.environ["IA_SECRET_KEY"]
          RUN_ID = os.environ["RUN_ID"]
          RUN_ATTEMPT = os.environ["RUN_ATTEMPT"]
          LEGACY_PREFIXES = tuple(
              prefix.strip()
              for prefix in os.environ.get(
                  "LEGACY_PREFIXES",
                  "",
              ).split(",")
              if prefix.strip()
          )

          LOCAL_STATE_DIR.mkdir(
              parents=True,
              exist_ok=True,
          )
          CONTROLLER_STATE_PATH.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          def utc_now() -> str:
              return datetime.now(
                  timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ")

          def greece_now() -> str:
              return datetime.now(
                  ZoneInfo("Europe/Athens")
              ).strftime("%Y-%m-%d %H:%M:%S %Z")

          def sha256_file(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(
                      lambda: stream.read(
                          1024 * 1024
                      ),
                      b"",
                  ):
                      digest.update(chunk)
              return digest.hexdigest()

          def remote_url(
              host: str,
              item: str,
              remote_name: str,
          ) -> str:
              return (
                  host.rstrip("/")
                  + "/"
                  + urllib.parse.quote(
                      item,
                      safe="",
                  )
                  + "/"
                  + urllib.parse.quote(
                      remote_name,
                      safe="/~._-()",
                  )
              )

          def run_curl(
              arguments: list[str],
              *,
              retries: int = 6,
          ) -> None:
              command = [
                  "curl",
                  "--silent",
                  "--show-error",
                  "--fail-with-body",
                  "--location",
                  "--retry",
                  str(retries),
                  "--retry-all-errors",
                  "--retry-delay",
                  "10",
                  "--retry-max-time",
                  "1200",
                  "--connect-timeout",
                  "45",
                  *arguments,
              ]

              subprocess.run(
                  command,
                  check=True,
              )

          def upload_file(
              local_path: pathlib.Path,
              remote_name: str,
              *,
              metadata: bool = False,
          ) -> None:
              headers = [
                  "--header",
                  (
                      "Authorization: LOW "
                      f"{ACCESS_KEY}:{SECRET_KEY}"
                  ),
                  "--header",
                  "x-amz-auto-make-bucket:1",
                  "--header",
                  "x-archive-ignore-preexisting-bucket:1",
                  "--header",
                  "x-archive-keep-old-version:0",
                  "--header",
                  "x-archive-queue-derive:0",
              ]

              if metadata:
                  headers.extend([
                      "--header",
                      f"x-archive-meta-title:{TITLE}",
                      "--header",
                      "x-archive-meta-creator:DedSec Project",
                      "--header",
                      "x-archive-meta-mediatype:software",
                      "--header",
                      (
                          "x-archive-meta-description:"
                          "Incrementally synchronized current files "
                          f"and Git history for {REPOSITORY}."
                      ),
                      "--header",
                      (
                          "x-archive-meta-subject:"
                          "DedSec Project; source code; "
                          "Git history; software preservation"
                      ),
                  ])

              run_curl([
                  *headers,
                  "--upload-file",
                  str(local_path),
                  remote_url(
                      "https://s3.us.archive.org",
                      ITEM,
                      remote_name,
                  ),
              ])

          def delete_remote(
              remote_name: str,
          ) -> None:
              url = remote_url(
                  "https://s3.us.archive.org",
                  ITEM,
                  remote_name,
              )

              command = [
                  "curl",
                  "--silent",
                  "--show-error",
                  "--location",
                  "--request",
                  "DELETE",
                  "--retry",
                  "6",
                  "--retry-all-errors",
                  "--retry-delay",
                  "10",
                  "--header",
                  (
                      "Authorization: LOW "
                      f"{ACCESS_KEY}:{SECRET_KEY}"
                  ),
                  "--header",
                  "x-archive-cascade-delete:1",
                  "--header",
                  "x-archive-keep-old-version:0",
                  "--write-out",
                  "%{http_code}",
                  "--output",
                  "delete-response.txt",
                  url,
              ]

              result = subprocess.run(
                  command,
                  check=True,
                  text=True,
                  capture_output=True,
              )

              status_code = result.stdout.strip()
              if status_code not in {
                  "200",
                  "202",
                  "204",
                  "404",
              }:
                  body = pathlib.Path(
                      "delete-response.txt"
                  ).read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
                  raise RuntimeError(
                      f"Delete failed for "
                      f"{remote_name!r}: "
                      f"HTTP {status_code}: "
                      f"{body[:1000]}"
                  )

          RETRYABLE_HTTP_CODES = {
              408,
              425,
              429,
              500,
              502,
              503,
              504,
          }

          def retry_delay(
              attempt: int,
              retry_after: str | None = None,
          ) -> int:
              if (
                  retry_after
                  and retry_after.isdigit()
              ):
                  return min(
                      300,
                      max(1, int(retry_after)),
                  )

              # 10, 20, 40, 80, then 120 seconds.
              return min(
                  120,
                  10 * (2 ** min(attempt - 1, 4)),
              )

          def get_json_with_retry(
              url_factory,
              *,
              label: str,
              not_found,
              attempts: int = 12,
          ):
              last_error: BaseException | None = None

              for attempt in range(1, attempts + 1):
                  url = url_factory()
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": (
                              "DedSec-Incremental-Archive/4.1"
                          ),
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120,
                      ) as response:
                          return json.load(response)

                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return not_found

                      last_error = error
                      if (
                          error.code
                          not in RETRYABLE_HTTP_CODES
                      ):
                          raise

                      delay = retry_delay(
                          attempt,
                          error.headers.get(
                              "Retry-After"
                          ),
                      )
                      print(
                          f"{label}: Internet Archive "
                          f"returned HTTP {error.code}; "
                          f"retrying {attempt}/{attempts} "
                          f"in {delay}s."
                      )
                      time.sleep(delay)

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      json.JSONDecodeError,
                      UnicodeDecodeError,
                  ) as error:
                      last_error = error
                      delay = retry_delay(attempt)
                      print(
                          f"{label}: temporary read "
                          f"failure {error!r}; retrying "
                          f"{attempt}/{attempts} "
                          f"in {delay}s."
                      )
                      time.sleep(delay)

              raise RuntimeError(
                  f"{label} remained unavailable after "
                  f"{attempts} attempts: {last_error!r}"
              )

          def download_json(
              remote_name: str,
          ) -> dict | None:
              def url_factory() -> str:
                  base = remote_url(
                      "https://archive.org/download",
                      ITEM,
                      remote_name,
                  )
                  return (
                      f"{base}?state_read="
                      f"{int(time.time())}-"
                      f"{random.random()}"
                  )

              payload = get_json_with_retry(
                  url_factory,
                  label=(
                      f"Checkpoint download for {ITEM}"
                  ),
                  not_found=None,
              )

              return (
                  payload
                  if isinstance(payload, dict)
                  else None
              )

          def fetch_metadata() -> dict[str, dict]:
              encoded_item = urllib.parse.quote(
                  ITEM,
                  safe="",
              )

              def url_factory() -> str:
                  return (
                      f"https://archive.org/metadata/"
                      f"{encoded_item}"
                      f"?state_check={int(time.time())}"
                      f"-{random.random()}"
                  )

              payload = get_json_with_retry(
                  url_factory,
                  label=f"Metadata read for {ITEM}",
                  not_found={},
              )

              files = {}
              for entry in payload.get("files", []):
                  if not isinstance(entry, dict):
                      continue
                  name = entry.get("name")
                  if not isinstance(name, str):
                      continue
                  files[name] = entry

              return files

          def default_state() -> dict:
              return {
                  "schema_version": SCHEMA_VERSION,
                  "target": {
                      "repository": REPOSITORY,
                      "slug": SLUG,
                      "title": TITLE,
                      "marker": MARKER,
                      "kind": KIND,
                      "sites": SITES,
                      "ia_item": ITEM,
                      "window": WINDOW,
                  },
                  "initial_sync_completed": False,
                  "files": {},
                  "directories": [],
                  "git_bundle": {},
                  "last_completed_commit": None,
                  "last_completed_at_utc": None,
                  "last_completed_at_greece": None,
                  "last_result": {},
                  "current_run": {},
              }

          def load_controller_fallback() -> dict | None:
              if not CONTROLLER_STATE_PATH.exists():
                  return None

              try:
                  aggregate = json.loads(
                      CONTROLLER_STATE_PATH.read_text(
                          encoding="utf-8"
                      )
                  )
              except (
                  OSError,
                  json.JSONDecodeError,
              ):
                  return None

              target = (
                  aggregate.get(
                      "targets",
                      {},
                  ).get(SLUG)
              )

              if isinstance(target, dict):
                  return target

              return None

          state = download_json(IA_STATE_NAME)
          if not isinstance(state, dict):
              state = load_controller_fallback()

          if (
              not isinstance(state, dict)
              or state.get("schema_version")
              != SCHEMA_VERSION
          ):
              state = default_state()

          state["target"] = default_state()["target"]
          state.setdefault("files", {})
          state.setdefault("directories", [])
          state.setdefault("git_bundle", {})
          state.setdefault(
              "initial_sync_completed",
              False,
          )

          def write_local_and_controller_state() -> None:
              LOCAL_STATE_PATH.write_text(
                  json.dumps(
                      state,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )

              try:
                  if CONTROLLER_STATE_PATH.exists():
                      aggregate = json.loads(
                          CONTROLLER_STATE_PATH.read_text(
                              encoding="utf-8"
                          )
                      )
                  else:
                      aggregate = {
                          "schema_version": SCHEMA_VERSION,
                          "generated_at_utc": None,
                          "targets": {},
                      }
              except (
                  OSError,
                  json.JSONDecodeError,
              ):
                  aggregate = {
                      "schema_version": SCHEMA_VERSION,
                      "generated_at_utc": None,
                      "targets": {},
                  }

              aggregate["schema_version"] = (
                  SCHEMA_VERSION
              )
              aggregate["generated_at_utc"] = utc_now()
              aggregate.setdefault(
                  "targets",
                  {},
              )[SLUG] = state

              CONTROLLER_STATE_PATH.write_text(
                  json.dumps(
                      aggregate,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )

          first_state_upload = (
              not state.get("files")
              and not state.get(
                  "initial_sync_completed",
                  False,
              )
          )

          def persist_state() -> None:
              global first_state_upload

              state["state_updated_at_utc"] = utc_now()
              write_local_and_controller_state()
              upload_file(
                  LOCAL_STATE_PATH,
                  IA_STATE_NAME,
                  metadata=first_state_upload,
              )
              first_state_upload = False

          def inventory_working_tree() -> tuple[
              dict[str, dict],
              list[str],
          ]:
              files: dict[str, dict] = {}
              directories: set[str] = set()

              for root, directory_names, filenames in os.walk(
                  SOURCE_ROOT,
                  topdown=True,
                  followlinks=False,
              ):
                  directory_names[:] = sorted(
                      name
                      for name in directory_names
                      if name != ".git"
                  )

                  root_path = pathlib.Path(root)
                  relative_root = root_path.relative_to(
                      SOURCE_ROOT
                  )

                  if str(relative_root) != ".":
                      directories.add(
                          relative_root.as_posix()
                      )

                  for name in sorted(filenames):
                      path = root_path / name
                      relative = path.relative_to(
                          SOURCE_ROOT
                      ).as_posix()

                      if (
                          relative == ".git"
                          or relative.startswith(
                              ".git/"
                          )
                          or "/.git/" in relative
                      ):
                          continue

                      if path.is_symlink():
                          target = os.readlink(path)
                          payload = (
                              "SYMLINK\0" + target
                          ).encode("utf-8")
                          digest = hashlib.sha256(
                              payload
                          ).hexdigest()
                          files[relative] = {
                              "sha256": digest,
                              "size": len(
                                  target.encode("utf-8")
                              ),
                              "type": "symlink",
                              "link_target": target,
                              "remote_name": (
                                  "mirror/" + relative
                              ),
                          }
                          continue

                      try:
                          mode = path.stat().st_mode
                      except OSError:
                          continue

                      if not stat.S_ISREG(mode):
                          continue

                      files[relative] = {
                          "sha256": sha256_file(path),
                          "size": path.stat().st_size,
                          "type": "file",
                          "executable": bool(
                              mode & stat.S_IXUSR
                          ),
                          "remote_name": (
                              "mirror/" + relative
                          ),
                      }

              return files, sorted(directories)

          def local_payload_for(
              relative_path: str,
              metadata: dict,
          ) -> tuple[pathlib.Path, pathlib.Path | None]:
              source_path = (
                  SOURCE_ROOT
                  / pathlib.PurePosixPath(
                      relative_path
                  )
              )

              if metadata["type"] == "file":
                  return source_path, None

              temporary = tempfile.NamedTemporaryFile(
                  prefix="dedsec-symlink-",
                  suffix=".txt",
                  delete=False,
              )
              temporary_path = pathlib.Path(
                  temporary.name
              )

              with temporary:
                  temporary.write(
                      metadata[
                          "link_target"
                      ].encode("utf-8")
                  )

              return temporary_path, temporary_path

          def build_wayback_urls(
              changed_paths: list[str],
              *,
              initial: bool,
              commit: str,
          ) -> list[str]:
              github = (
                  f"https://github.com/{REPOSITORY}"
              )
              raw_github = (
                  "https://raw.githubusercontent.com/"
                  f"{REPOSITORY}"
              )

              urls = {
                  github,
                  f"{github}/commit/{commit}",
                  f"{github}/tree/{commit}",
                  f"{github}/branches",
                  f"{github}/tags",
                  f"{github}/releases",
                  f"{github}/archive/{commit}.zip",
                  f"{github}/archive/{commit}.tar.gz",
              }

              paths = (
                  sorted(current_files)
                  if initial
                  else sorted(changed_paths)
              )

              public_excluded_prefixes = (
                  ".git/",
                  ".github/",
              )
              public_excluded_names = {
                  ".gitignore",
                  ".gitattributes",
                  ".nojekyll",
                  "README",
                  "README.md",
                  "README.txt",
                  "LICENSE",
                  "LICENSE.md",
                  "LICENSE.txt",
                  "SECURITY.md",
              }

              if KIND == "website":
                  for site in SITES:
                      urls.add(site + "/")

              for relative in paths:
                  encoded = urllib.parse.quote(
                      relative,
                      safe="/~._-()",
                  )

                  urls.add(
                      f"{github}/blob/"
                      f"{commit}/{encoded}"
                  )
                  urls.add(
                      f"{raw_github}/"
                      f"{commit}/{encoded}"
                  )

                  if KIND != "website":
                      continue

                  if (
                      relative.startswith(
                          public_excluded_prefixes
                      )
                      or relative in public_excluded_names
                      or "/." in relative
                  ):
                      continue

                  for site in SITES:
                      urls.add(
                          f"{site}/{encoded}"
                      )

                      lower = relative.lower()
                      if lower == "index.html":
                          urls.add(site + "/")
                      elif lower.endswith(
                          "/index.html"
                      ):
                          urls.add(
                              f"{site}/"
                              f"{encoded[:-len('index.html')]}"
                          )

              return sorted(urls)

          def submit_wayback(
              urls: list[str],
          ) -> dict:
              accepted = []
              failures = []

              for number, url in enumerate(
                  urls,
                  start=1,
              ):
                  payload = urllib.parse.urlencode({
                      "url": url,
                      "capture_outlinks": "0",
                      "capture_screenshot": "0",
                      "skip_first_archive": "0",
                  }).encode("utf-8")

                  succeeded = False
                  last_error = "Unknown error"

                  for attempt in range(1, 7):
                      request = urllib.request.Request(
                          "https://web.archive.org/save",
                          data=payload,
                          method="POST",
                          headers={
                              "Authorization": (
                                  f"LOW {ACCESS_KEY}:"
                                  f"{SECRET_KEY}"
                              ),
                              "Accept": (
                                  "application/json"
                              ),
                              "User-Agent": (
                                  "DedSec-Incremental-"
                                  "Archive/4.0"
                              ),
                          },
                      )

                      try:
                          with urllib.request.urlopen(
                              request,
                              timeout=120,
                          ) as response:
                              body = response.read().decode(
                                  "utf-8",
                                  "replace",
                              )

                              try:
                                  result = json.loads(
                                      body
                                  )
                              except json.JSONDecodeError:
                                  result = {
                                      "response": (
                                          body[:2000]
                                      ),
                                  }

                              accepted.append({
                                  "url": url,
                                  "http_status": (
                                      response.status
                                  ),
                                  "result": result,
                              })
                              print(
                                  f"[Wayback "
                                  f"{number}/{len(urls)}] "
                                  f"accepted: {url}"
                              )
                              succeeded = True
                              break

                      except urllib.error.HTTPError as error:
                          body = error.read().decode(
                              "utf-8",
                              "replace",
                          )
                          last_error = (
                              f"HTTP {error.code}: "
                              f"{body[:1000]}"
                          )

                          if error.code == 403 and (
                              "InvalidAccessKeyId" in body
                              or "SignatureDoesNotMatch"
                              in body
                          ):
                              raise RuntimeError(
                                  "Internet Archive rejected "
                                  "the configured credentials."
                              )

                          if error.code not in {
                              408,
                              425,
                              429,
                              500,
                              502,
                              503,
                              504,
                          }:
                              break

                          retry_after = (
                              error.headers.get(
                                  "Retry-After"
                              )
                          )
                          delay = (
                              int(retry_after)
                              if retry_after
                              and retry_after.isdigit()
                              else min(
                                  180,
                                  12 * attempt,
                              )
                          )
                          time.sleep(delay)

                      except Exception as error:
                          last_error = repr(error)
                          time.sleep(
                              min(
                                  180,
                                  12 * attempt,
                              )
                          )

                  if not succeeded:
                      failures.append({
                          "url": url,
                          "error": last_error,
                      })
                      print(
                          "::warning title=Wayback "
                          f"capture failed::{url} — "
                          f"{last_error}"
                      )

                  time.sleep(
                      0.7
                      + random.random() * 0.5
                  )

              return {
                  "submitted_at_utc": utc_now(),
                  "requested": len(urls),
                  "accepted": len(accepted),
                  "failed": len(failures),
                  "accepted_requests": accepted,
                  "failures": failures,
              }

          def upload_stable_json(
              payload: dict,
              local_name: str,
              remote_name: str,
          ) -> None:
              path = pathlib.Path(local_name)
              path.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
              upload_file(
                  path,
                  remote_name,
              )

          current_commit = subprocess.check_output(
              [
                  "git",
                  "-C",
                  str(SOURCE_ROOT),
                  "rev-parse",
                  "HEAD",
              ],
              text=True,
          ).strip()

          current_files, current_directories = (
              inventory_working_tree()
          )
          remote_metadata = fetch_metadata()

          old_files = state.get("files", {})
          initial_sync = not state.get(
              "initial_sync_completed",
              False,
          )

          uploads = []
          for relative, metadata in current_files.items():
              previous = old_files.get(relative)
              remote_name = metadata["remote_name"]
              remote_entry = remote_metadata.get(
                  remote_name
              )

              remote_size = None
              if isinstance(remote_entry, dict):
                  try:
                      remote_size = int(
                          remote_entry.get("size")
                      )
                  except (
                      TypeError,
                      ValueError,
                  ):
                      remote_size = None

              if (
                  not isinstance(previous, dict)
                  or previous.get("sha256")
                  != metadata["sha256"]
                  or previous.get("type")
                  != metadata["type"]
                  or remote_entry is None
                  or (
                      metadata["type"] == "file"
                      and remote_size is not None
                      and remote_size
                      != metadata["size"]
                  )
              ):
                  uploads.append(relative)

          removed_from_repository = sorted(
              set(old_files)
              - set(current_files)
          )

          expected_remote_names = {
              metadata["remote_name"]
              for metadata in current_files.values()
          }

          orphan_remote_names = sorted(
              name
              for name in remote_metadata
              if name.startswith("mirror/")
              and name not in expected_remote_names
              and not name.startswith(".~~")
          )

          state["current_run"] = {
              "run_id": RUN_ID,
              "run_attempt": RUN_ATTEMPT,
              "status": "in_progress",
              "started_at_utc": utc_now(),
              "source_commit": current_commit,
              "initial_sync": initial_sync,
              "total_current_files": len(
                  current_files
              ),
              "planned_uploads": len(uploads),
              "planned_repository_deletes": len(
                  removed_from_repository
              ),
              "planned_orphan_deletes": len(
                  orphan_remote_names
              ),
              "completed_uploads": 0,
              "completed_deletes": 0,
              "last_successful_operation": None,
              "remaining_uploads": list(uploads),
              "remaining_deletes": (
                  removed_from_repository
                  + orphan_remote_names
              ),
          }
          persist_state()

          changed_paths = list(uploads)

          try:
              for index, relative in enumerate(
                  uploads,
                  start=1,
              ):
                  metadata = current_files[relative]
                  local_path, temporary_path = (
                      local_payload_for(
                          relative,
                          metadata,
                      )
                  )

                  try:
                      print(
                          f"[Upload {index}/"
                          f"{len(uploads)}] "
                          f"{relative}"
                      )
                      upload_file(
                          local_path,
                          metadata["remote_name"],
                      )
                  finally:
                      if temporary_path is not None:
                          temporary_path.unlink(
                              missing_ok=True
                          )

                  state["files"][relative] = (
                      metadata
                  )
                  state["directories"] = (
                      current_directories
                  )
                  state["current_run"][
                      "completed_uploads"
                  ] += 1
                  state["current_run"][
                      "last_successful_operation"
                  ] = {
                      "action": "upload",
                      "path": relative,
                      "remote_name": (
                          metadata["remote_name"]
                      ),
                      "completed_at_utc": utc_now(),
                  }
                  state["current_run"][
                      "remaining_uploads"
                  ] = uploads[index:]

                  # This is the exact file-level resume checkpoint.
                  # It is written locally and overwritten in Internet
                  # Archive after every successful file upload.
                  persist_state()

              delete_operations = [
                  (
                      relative,
                      old_files[relative][
                          "remote_name"
                      ],
                      "repository_deleted",
                  )
                  for relative in removed_from_repository
              ]

              delete_operations.extend(
                  (
                      remote_name.removeprefix(
                          "mirror/"
                      ),
                      remote_name,
                      "orphan_remote",
                  )
                  for remote_name in orphan_remote_names
              )

              for index, (
                  relative,
                  remote_name,
                  reason,
              ) in enumerate(
                  delete_operations,
                  start=1,
              ):
                  print(
                      f"[Delete {index}/"
                      f"{len(delete_operations)}] "
                      f"{remote_name}"
                  )
                  delete_remote(remote_name)

                  state["files"].pop(
                      relative,
                      None,
                  )
                  state["current_run"][
                      "completed_deletes"
                  ] += 1
                  state["current_run"][
                      "last_successful_operation"
                  ] = {
                      "action": "delete",
                      "path": relative,
                      "remote_name": remote_name,
                      "reason": reason,
                      "completed_at_utc": utc_now(),
                  }
                  state["current_run"][
                      "remaining_deletes"
                  ] = [
                      operation[1]
                      for operation
                      in delete_operations[
                          index:
                      ]
                  ]
                  persist_state()

              bundle_changed = (
                  state.get(
                      "git_bundle",
                      {},
                  ).get("commit")
                  != current_commit
                  or "git-history.bundle"
                  not in remote_metadata
              )

              if bundle_changed:
                  bundle_path = pathlib.Path(
                      "git-history.bundle"
                  )
                  subprocess.run(
                      [
                          "git",
                          "-C",
                          str(SOURCE_ROOT),
                          "bundle",
                          "create",
                          str(
                              bundle_path.resolve()
                          ),
                          "--all",
                      ],
                      check=True,
                  )

                  upload_file(
                      bundle_path,
                      "git-history.bundle",
                  )

                  state["git_bundle"] = {
                      "commit": current_commit,
                      "sha256": sha256_file(
                          bundle_path
                      ),
                      "size": (
                          bundle_path.stat().st_size
                      ),
                      "remote_name": (
                          "git-history.bundle"
                      ),
                      "uploaded_at_utc": utc_now(),
                  }
                  state["current_run"][
                      "last_successful_operation"
                  ] = {
                      "action": (
                          "upload_git_bundle"
                      ),
                      "remote_name": (
                          "git-history.bundle"
                      ),
                      "completed_at_utc": utc_now(),
                  }
                  persist_state()

              manifest = {
                  "schema_version": SCHEMA_VERSION,
                  "generated_at_utc": utc_now(),
                  "repository": REPOSITORY,
                  "title": TITLE,
                  "commit": current_commit,
                  "kind": KIND,
                  "sites": SITES,
                  "directories": current_directories,
                  "file_count": len(current_files),
                  "files": current_files,
                  "git_bundle": state.get(
                      "git_bundle",
                      {},
                  ),
                  "restore_notes": {
                      "current_files": (
                          "Download the mirror/ tree "
                          "using the paths in this "
                          "manifest."
                      ),
                      "git_history": (
                          "git clone "
                          "git-history.bundle "
                          "restored-repository"
                      ),
                  },
              }

              upload_stable_json(
                  manifest,
                  "manifest.json",
                  "manifest.json",
              )

              checksum_path = pathlib.Path(
                  "SHA256SUMS.txt"
              )
              checksum_path.write_text(
                  "".join(
                      f"{metadata['sha256']}  "
                      f"{relative}\n"
                      for relative, metadata
                      in sorted(
                          current_files.items()
                      )
                  )
                  + (
                      f"{state['git_bundle'].get('sha256', '')}"
                      "  git-history.bundle\n"
                  ),
                  encoding="utf-8",
              )
              upload_file(
                  checksum_path,
                  "SHA256SUMS.txt",
              )

              wayback_urls = build_wayback_urls(
                  changed_paths,
                  initial=initial_sync,
                  commit=current_commit,
              )
              wayback_report = submit_wayback(
                  wayback_urls
              )
              wayback_report["initial_full_capture"] = (
                  initial_sync
              )
              wayback_report[
                  "changed_paths_submitted"
              ] = changed_paths
              wayback_report[
                  "deleted_repository_paths"
              ] = removed_from_repository

              upload_stable_json(
                  wayback_report,
                  "wayback-report.json",
                  "wayback-report.json",
              )

              # Verify that all current mirror objects and stable
              # control files are visible before marking complete.
              expected = {
                  metadata["remote_name"]
                  for metadata
                  in current_files.values()
              }
              expected.update({
                  IA_STATE_NAME,
                  "git-history.bundle",
                  "manifest.json",
                  "SHA256SUMS.txt",
                  "wayback-report.json",
              })

              visible = set()
              for attempt in range(1, 61):
                  visible = set(
                      fetch_metadata()
                  )
                  missing = expected - visible
                  if not missing:
                      break

                  print(
                      "Waiting for Internet Archive "
                      "metadata. Missing "
                      f"{len(missing)} files."
                  )
                  time.sleep(10)
              else:
                  raise RuntimeError(
                      "Final verification failed. "
                      "The current archive was not "
                      "marked complete."
                  )

              # Remove legacy timestamped packages created by older
              # workflow versions only after the new mirror is complete.
              legacy_files = sorted(
                  name
                  for name in visible
                  if (
                      name.startswith(
                          LEGACY_PREFIXES
                      )
                      or (
                          name.startswith(".~~")
                          and name.removeprefix(
                              ".~~"
                          ).startswith(
                              LEGACY_PREFIXES
                          )
                      )
                  )
                  and name not in expected
              )

              for name in legacy_files:
                  print(
                      f"Deleting legacy archive: {name}"
                  )
                  delete_remote(name)

              state["files"] = current_files
              state["directories"] = (
                  current_directories
              )
              state["initial_sync_completed"] = True
              state["last_completed_commit"] = (
                  current_commit
              )
              state["last_completed_at_utc"] = (
                  utc_now()
              )
              state[
                  "last_completed_at_greece"
              ] = greece_now()
              state["last_result"] = {
                  "initial_full_sync": initial_sync,
                  "uploaded_new_or_changed": len(
                      uploads
                  ),
                  "deleted_from_repository": len(
                      removed_from_repository
                  ),
                  "deleted_orphan_remote_files": len(
                      orphan_remote_names
                  ),
                  "deleted_legacy_archives": len(
                      legacy_files
                  ),
                  "unchanged_files": (
                      len(current_files)
                      - len(uploads)
                  ),
                  "wayback_requested": (
                      wayback_report["requested"]
                  ),
                  "wayback_accepted": (
                      wayback_report["accepted"]
                  ),
                  "wayback_failed": (
                      wayback_report["failed"]
                  ),
              }
              state["current_run"].update({
                  "status": "complete",
                  "completed_at_utc": utc_now(),
                  "remaining_uploads": [],
                  "remaining_deletes": [],
              })
              persist_state()

          except BaseException as error:
              state["current_run"]["status"] = (
                  "failed"
              )
              state["current_run"][
                  "failed_at_utc"
              ] = utc_now()
              state["current_run"]["error"] = (
                  f"{type(error).__name__}: "
                  f"{error}"
              )
              state["current_run"][
                  "traceback"
              ] = traceback.format_exc()[-8000:]

              try:
                  persist_state()
              except Exception as state_error:
                  print(
                      "::warning title=State checkpoint "
                      "failed::"
                      f"{state_error!r}"
                  )

              raise

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"slug={SLUG}\n"
              )
              output.write(
                  f"status={state['current_run']['status']}\n"
              )
              output.write(
                  "uploaded="
                  f"{state['last_result']['uploaded_new_or_changed']}\n"
              )
              output.write(
                  "deleted="
                  f"{state['last_result']['deleted_from_repository']}\n"
              )
          PY

      - name: Upload local checkpoint copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-checkpoint-${{ matrix.slug }}-${{ github.run_id }}
          path: |
            archive-state/${{ matrix.slug }}.json
            controller/.github/workflows/update.json
          if-no-files-found: ignore
          retention-days: 14

  update-controller-state:
    name: Update update.json and README
    needs:
      - prepare
      - archive-targets
    if: |
      always() &&
      needs.prepare.outputs.target_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SELECTED_TARGETS: ${{ needs.prepare.outputs.selected_targets }}
      IA_ACCESS_KEY: ${{ secrets.Internet_Archive_1 }}
      IA_SECRET_KEY: ${{ secrets.Internet_Archive_2 }}

    steps:
      - name: Check out archive controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0

      - name: Synchronize persistent update.json and README
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          SCHEMA_VERSION = 4
          CONTROLLER = pathlib.Path("controller")
          UPDATE_PATH = (
              CONTROLLER
              / ".github"
              / "workflows"
              / "update.json"
          )
          README_PATH = CONTROLLER / "README.md"

          targets = json.loads(
              os.environ["SELECTED_TARGETS"]
          )

          def utc_now() -> str:
              return datetime.now(
                  timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ")

          def state_url(
              item: str,
          ) -> str:
              return (
                  "https://archive.org/download/"
                  + urllib.parse.quote(
                      item,
                      safe="",
                  )
                  + "/archive-state/update.json"
                  + f"?controller_sync={urllib.parse.quote(utc_now())}"
              )

          def fetch_state(
              target: dict,
          ) -> dict | None:
              retryable = {
                  408,
                  425,
                  429,
                  500,
                  502,
                  503,
                  504,
              }
              last_error = None

              for attempt in range(1, 9):
                  request = urllib.request.Request(
                      state_url(
                          target["ia_item"]
                      ),
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": (
                              "DedSec-Controller-State/4.1"
                          ),
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120,
                      ) as response:
                          state = json.load(response)

                      return (
                          state
                          if isinstance(state, dict)
                          else None
                      )

                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return None

                      last_error = error
                      if error.code not in retryable:
                          raise

                      retry_after = error.headers.get(
                          "Retry-After"
                      )
                      delay = (
                          min(300, int(retry_after))
                          if retry_after
                          and retry_after.isdigit()
                          else min(
                              120,
                              10 * (
                                  2
                                  ** min(
                                      attempt - 1,
                                      4,
                                  )
                              ),
                          )
                      )
                      print(
                          f"Controller state read for "
                          f"{target['slug']} returned "
                          f"HTTP {error.code}; retrying "
                          f"{attempt}/8 in {delay}s."
                      )
                      time.sleep(delay)

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      json.JSONDecodeError,
                      UnicodeDecodeError,
                  ) as error:
                      last_error = error
                      delay = min(
                          120,
                          10 * (
                              2
                              ** min(
                                  attempt - 1,
                                  4,
                              )
                          ),
                      )
                      print(
                          f"Controller state read for "
                          f"{target['slug']} failed "
                          f"temporarily; retrying "
                          f"{attempt}/8 in {delay}s."
                      )
                      time.sleep(delay)

              print(
                  "::warning title=Controller state "
                  f"temporarily unavailable::"
                  f"{target['slug']}: {last_error!r}"
              )
              return None

          try:
              aggregate = json.loads(
                  UPDATE_PATH.read_text(
                      encoding="utf-8"
                  )
              )
          except (
              OSError,
              json.JSONDecodeError,
          ):
              aggregate = {
                  "schema_version": SCHEMA_VERSION,
                  "generated_at_utc": None,
                  "targets": {},
              }

          aggregate["schema_version"] = (
              SCHEMA_VERSION
          )
          aggregate.setdefault(
              "targets",
              {},
          )

          fetched_states = {}

          for target in targets:
              state = fetch_state(target)
              if state is None:
                  print(
                      "::warning title=Archive state "
                      f"unavailable::{target['slug']}"
                  )
                  continue

              aggregate["targets"][
                  target["slug"]
              ] = state
              fetched_states[
                  target["slug"]
              ] = state

          aggregate["generated_at_utc"] = utc_now()
          aggregate["source_of_truth"] = (
              "Each Internet Archive item stores "
              "archive-state/update.json. This GitHub "
              "file is the synchronized readable copy."
          )
          aggregate["resume_behavior"] = (
              "Every confirmed file upload or deletion "
              "is checkpointed. A later run recomputes "
              "the difference and skips completed files."
          )

          UPDATE_PATH.parent.mkdir(
              parents=True,
              exist_ok=True,
          )
          UPDATE_PATH.write_text(
              json.dumps(
                  aggregate,
                  indent=2,
                  ensure_ascii=False,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          if README_PATH.exists():
              readme = README_PATH.read_text(
                  encoding="utf-8"
              )
          else:
              readme = "# Save DedSec Project\n"

          def replace_block(
              text: str,
              marker: str,
              block: str,
          ) -> str:
              start = f"<!-- {marker}_START -->"
              end = f"<!-- {marker}_END -->"

              if start in text and end in text:
                  before, remainder = text.split(
                      start,
                      1,
                  )
                  _, after = remainder.split(
                      end,
                      1,
                  )
                  return (
                      before.rstrip()
                      + "\n\n"
                      + block
                      + after
                  )

              return (
                  text.rstrip()
                  + "\n\n"
                  + block
                  + "\n"
              )

          def build_status_block(
              state: dict,
          ) -> str:
              target = state["target"]
              marker = target["marker"]
              start = (
                  f"<!-- {marker}_START -->"
              )
              end = f"<!-- {marker}_END -->"

              current = state.get(
                  "current_run",
                  {},
              )
              result = state.get(
                  "last_result",
                  {},
              )
              commit = (
                  state.get(
                      "last_completed_commit"
                  )
                  or current.get(
                      "source_commit"
                  )
                  or ""
              )

              repository = target["repository"]
              ia_url = (
                  "https://archive.org/details/"
                  + target["ia_item"]
              )
              wayback_url = (
                  "https://web.archive.org/web/*/"
                  "https://github.com/"
                  + repository
                  + "*"
              )

              status = current.get(
                  "status",
                  "not_started",
              )
              last_operation = current.get(
                  "last_successful_operation"
              )
              last_operation_text = (
                  json.dumps(
                      last_operation,
                      ensure_ascii=False,
                  )
                  if last_operation
                  else "None"
              )

              lines = [
                  start,
                  f"### {target['title']}",
                  "",
                  (
                      "**Current synchronization "
                      f"status:** `{status}`  "
                  ),
                  (
                      "**Last complete save:** "
                      f"{state.get('last_completed_at_greece') or 'Not completed yet'}"
                      "  "
                  ),
                  (
                      "**Mirrored current files:** "
                      f"{len(state.get('files', {}))}  "
                  ),
                  (
                      "**Pending uploads:** "
                      f"{len(current.get('remaining_uploads', []))}  "
                  ),
                  (
                      "**Pending deletions:** "
                      f"{len(current.get('remaining_deletes', []))}  "
                  ),
                  (
                      "**Last successful operation:** "
                      f"`{last_operation_text}`  "
                  ),
                  (
                      "**Last completed update:** "
                      f"{result.get('uploaded_new_or_changed', 0)} "
                      "new/changed, "
                      f"{result.get('deleted_from_repository', 0)} "
                      "deleted, "
                      f"{result.get('unchanged_files', 0)} "
                      "unchanged.  "
                  ),
                  (
                      "**Scheduled window:** "
                      f"{target['window']}  "
                  ),
                  (
                      "**Resume mode:** File-level. "
                      "Completed files are skipped; only "
                      "the interrupted file may be retried."
                  ),
                  "",
                  (
                      "- [Internet Archive current mirror]"
                      f"({ia_url})"
                  ),
                  (
                      "- [Wayback Machine capture history]"
                      f"({wayback_url})"
                  ),
              ]

              if commit:
                  lines.append(
                      "- [Last archived commit]"
                      f"(https://github.com/"
                      f"{repository}/commit/{commit})"
                  )

              if target.get("kind") == "website":
                  for site in target.get(
                      "sites",
                      [],
                  ):
                      lines.append(
                          "- ["
                          + site
                          + " Wayback history]"
                          + "(https://web.archive.org/"
                          + "web/*/"
                          + site
                          + "/*)"
                      )

              lines.extend([
                  "",
                  (
                      "This section is updated from "
                      "`.github/workflows/update.json`."
                  ),
                  end,
              ])

              return "\n".join(lines)

          for slug, state in fetched_states.items():
              marker = state.get(
                  "target",
                  {},
              ).get("marker")
              if not marker:
                  continue

              readme = replace_block(
                  readme,
                  marker,
                  build_status_block(state),
              )

          README_PATH.write_text(
              readme,
              encoding="utf-8",
          )
          PY

      - name: Commit state and README
        shell: bash
        run: |
          set -euo pipefail

          git -C controller config \
            user.name "github-actions[bot]"

          git -C controller config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C controller add \
            .github/workflows/update.json \
            README.md

          if git -C controller diff --cached --quiet; then
            echo "State and README are already current."
          else
            git -C controller commit \
              -m "chore: update archive checkpoint [skip ci]"

            git -C controller push
          fi
