name: Archive DedSec Project Repository

on:
  push:
  workflow_dispatch:
    inputs:
      full_archive:
        description: Archive every GitHub file page, not only changed files
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "41 04 * * 0"

permissions:
  contents: write   # required for auto-push

concurrency:
  group: dedsec-project-internet-archive
  cancel-in-progress: false

env:
  IA_ITEM_IDENTIFIER: dedsec1121fk-dedsec-project-repository-snapshots
  # HARDCODED credentials – will be auto‑removed after first run
  IA_ACCESS_KEY: 11ddlmcHs1j4ytdc
  IA_SECRET_KEY: pcdSnp7B0m3W5yqB

jobs:
  archive:
    # Skip runs triggered by our own auto‑commit (contains [skip ci])
    if: (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate Internet Archive credentials
        shell: bash
        run: |
          if [[ -z "${IA_ACCESS_KEY:-}" || -z "${IA_SECRET_KEY:-}" ]]; then
            echo "::error::Add IA_ACCESS_KEY and IA_SECRET_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create complete source and Git-history snapshots
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-output

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          source_zip="dedsec-project-source-${timestamp}-${short_sha}.zip"
          history_bundle="dedsec-project-full-history-${timestamp}-${short_sha}.bundle"
          manifest="dedsec-project-${timestamp}-${short_sha}-manifest.json"

          SOURCE_ZIP="${source_zip}" python <<'PY'
          import os
          import pathlib
          import zipfile

          root = pathlib.Path(".").resolve()
          destination = root / "archive-output" / os.environ["SOURCE_ZIP"]
          excluded_dirs = {".git", "archive-output"}

          with zipfile.ZipFile(destination, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob("*")):
                  relative = path.relative_to(root)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if path.is_file():
                      archive.write(path, relative.as_posix())
          PY

          git bundle create "archive-output/${history_bundle}" --all

          SOURCE_ZIP="${source_zip}" HISTORY_BUNDLE="${history_bundle}" MANIFEST="${manifest}" TIMESTAMP="${timestamp}" python <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          output = pathlib.Path("archive-output")
          files = [output / os.environ["SOURCE_ZIP"], output / os.environ["HISTORY_BUNDLE"]]

          checksums = {}
          for path in files:
              checksums[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()

          tracked_raw = subprocess.check_output(["git", "ls-files", "-z"])
          tracked = [p.decode("utf-8", "surrogateescape") for p in tracked_raw.split(b"\0") if p]
          refs = subprocess.check_output(
              ["git", "for-each-ref", "--format=%(refname) %(objectname)"], text=True
          ).splitlines()

          manifest = {
              "archive_type": "Complete DedSec Project repository snapshot",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "created_utc": os.environ["TIMESTAMP"],
              "source_snapshot": os.environ["SOURCE_ZIP"],
              "git_history_bundle": os.environ["HISTORY_BUNDLE"],
              "sha256": checksums,
              "tracked_file_count": len(tracked),
              "tracked_files": tracked,
              "git_refs": refs,
              "restore_commands": {
                  "source": f"unzip {os.environ['SOURCE_ZIP']}",
                  "history": f"git clone {os.environ['HISTORY_BUNDLE']} DedSec-restored",
              },
          }
          (output / os.environ["MANIFEST"]).write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          (output / "SHA256SUMS.txt").write_text(
              "".join(f"{digest}  {name}\n" for name, digest in checksums.items()),
              encoding="ascii",
          )
          PY

          echo "source_zip=${source_zip}" >> "$GITHUB_OUTPUT"
          echo "history_bundle=${history_bundle}" >> "$GITHUB_OUTPUT"
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Upload complete repository snapshots to Internet Archive
        shell: bash
        run: |
          set -euo pipefail

          upload_to_ia() {
            local file="$1"
            local remote_name
            remote_name="$(basename "$file")"

            curl --silent --show-error --fail-with-body --location \
              --retry 6 --retry-all-errors --retry-delay 10 \
              --header "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
              --header "x-amz-auto-make-bucket:1" \
              --header "x-archive-ignore-preexisting-bucket:1" \
              --header "x-archive-queue-derive:0" \
              --header "x-archive-meta-title:DedSec Project Complete Repository Snapshots" \
              --header "x-archive-meta-creator:DedSec Project" \
              --header "x-archive-meta-mediatype:software" \
              --header "x-archive-meta-description:Versioned source archives and complete Git-history bundles for the DedSec Project repository." \
              --header "x-archive-meta-subject:DedSec Project; GitHub; source code; Git history; cybersecurity education" \
              --upload-file "$file" \
              "https://s3.us.archive.org/${IA_ITEM_IDENTIFIER}/${remote_name}"
          }

          upload_to_ia "archive-output/${{ steps.snapshot.outputs.source_zip }}"
          upload_to_ia "archive-output/${{ steps.snapshot.outputs.history_bundle }}"
          upload_to_ia "archive-output/${{ steps.snapshot.outputs.manifest }}"
          upload_to_ia "archive-output/SHA256SUMS.txt"

          echo "Internet Archive item: https://archive.org/details/${IA_ITEM_IDENTIFIER}"

      - name: Build GitHub URLs for Wayback Machine
        id: urls
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FULL_INPUT: ${{ inputs.full_archive || 'false' }}
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import pathlib
          import subprocess
          import urllib.parse

          repository = os.environ["GITHUB_REPOSITORY"]
          current = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          before = os.environ.get("BEFORE_SHA", "")
          event = os.environ.get("EVENT_NAME", "")
          full_input = os.environ.get("FULL_INPUT", "false").lower() == "true"

          github = f"https://github.com/{repository}"
          raw_host = f"https://raw.githubusercontent.com/{repository}"
          urls = {
              github,
              f"{github}/commit/{current}",
              f"{github}/tree/{current}",
              f"{github}/archive/{current}.zip",
              f"{github}/archive/{current}.tar.gz",
          }

          def tracked_files():
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [(current, p.decode("utf-8", "surrogateescape")) for p in raw.split(b"\0") if p]

          full = event == "schedule" or full_input
          if event == "push" and (not before or set(before) == {"0"}):
              full = True

          selected = []
          if full:
              selected = tracked_files()
          else:
              try:
                  output = subprocess.check_output(
                      ["git", "diff", "--name-status", "-z", before, current]
                  )
                  fields = [f.decode("utf-8", "surrogateescape") for f in output.split(b"\0") if f]
                  index = 0
                  while index < len(fields):
                      status = fields[index]
                      index += 1
                      code = status[0]
                      if code in {"R", "C"}:
                          old_path = fields[index]
                          new_path = fields[index + 1]
                          index += 2
                          selected.append((before, old_path))
                          selected.append((current, new_path))
                      else:
                          path = fields[index]
                          index += 1
                          selected.append((before if code == "D" else current, path))
              except subprocess.CalledProcessError:
                  selected = tracked_files()

          for revision, path in selected:
              normalized = path.replace("\\", "/").lstrip("/")
              if not normalized:
                  continue
              encoded = urllib.parse.quote(normalized, safe="/~._-()")
              urls.add(f"{github}/blob/{revision}/{encoded}")

              local = pathlib.Path(path)
              if revision != current or local.is_file():
                  urls.add(f"{raw_host}/{revision}/{encoded}")

          pathlib.Path("wayback-urls.txt").write_text(
              "\n".join(sorted(urls)) + "\n", encoding="utf-8"
          )
          print(f"Prepared {len(urls)} GitHub URL(s) for Wayback Machine submission.")
          PY

          echo "count=$(wc -l < wayback-urls.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Submit repository pages and files to Wayback Machine
        if: steps.urls.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          access = os.environ["IA_ACCESS_KEY"]
          secret = os.environ["IA_SECRET_KEY"]
          urls = [
              line.strip()
              for line in pathlib.Path("wayback-urls.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          accepted = []
          failures = []

          for number, url in enumerate(urls, start=1):
              payload = urllib.parse.urlencode({
                  "url": url,
                  "capture_outlinks": "0",
                  "capture_screenshot": "0",
                  "skip_first_archive": "1",
              }).encode("utf-8")

              last_error = "unknown error"
              for attempt in range(1, 7):
                  request = urllib.request.Request(
                      "https://web.archive.org/save",
                      data=payload,
                      method="POST",
                      headers={
                          "Authorization": f"LOW {access}:{secret}",
                          "Accept": "application/json",
                          "User-Agent": "DedSec-Project-GitHub-Archiver/1.0",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          body = response.read().decode("utf-8", "replace")
                          data = json.loads(body) if body.lstrip().startswith("{") else {"response": body}
                          accepted.append({"url": url, "status": response.status, "result": data})
                          print(f"[{number}/{len(urls)}] accepted: {url}")
                          break
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")
                      last_error = f"HTTP {exc.code}: {body[:500]}"
                      if exc.code not in {429, 500, 502, 503, 504}:
                          break
                      retry_after = exc.headers.get("Retry-After")
                      delay = int(retry_after) if retry_after and retry_after.isdigit() else min(120, 10 * attempt)
                      print(f"[{number}/{len(urls)}] retry {attempt}/6 in {delay}s: {url}")
                      time.sleep(delay)
                  except Exception as exc:
                      last_error = repr(exc)
                      delay = min(120, 10 * attempt)
                      print(f"[{number}/{len(urls)}] retry {attempt}/6 in {delay}s: {url}")
                      time.sleep(delay)

              if not accepted or accepted[-1]["url"] != url:
                  failures.append({"url": url, "error": last_error})
                  print(f"::warning title=Wayback capture failed::{url} — {last_error}")

              time.sleep(3 + random.random() * 2)

          report = {
              "submitted_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "requested": len(urls),
              "accepted": len(accepted),
              "failed": len(failures),
              "accepted_requests": accepted,
              "failures": failures,
          }
          pathlib.Path("wayback-report.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print(f"Wayback requests accepted: {len(accepted)}/{len(urls)}")
          if urls and not accepted:
              raise SystemExit("Every Wayback Machine submission failed.")
          PY

      - name: Upload Wayback submission report to Internet Archive
        if: always() && hashFiles('wayback-report.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          report_name="dedsec-project-${{ steps.snapshot.outputs.timestamp }}-${GITHUB_SHA::12}-wayback-report.json"
          cp wayback-report.json "$report_name"

          curl --silent --show-error --fail-with-body --location \
            --retry 6 --retry-all-errors --retry-delay 10 \
            --header "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
            --header "x-amz-auto-make-bucket:1" \
            --header "x-archive-ignore-preexisting-bucket:1" \
            --header "x-archive-queue-derive:0" \
            --upload-file "$report_name" \
            "https://s3.us.archive.org/${IA_ITEM_IDENTIFIER}/${report_name}"

      # ----- AUTO‑UPDATE: remove hardcoded credentials after first run -----
      - name: Remove hardcoded credentials and self‑update (first run only)
        if: secrets.IA_ACCESS_KEY == '' && secrets.IA_SECRET_KEY == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for file in .github/workflows/website-internet-archive.yml .github/workflows/project-internet-archive.yml; do
            if [[ -f "$file" ]]; then
              sed -i '/IA_ACCESS_KEY:/s/.*/  IA_ACCESS_KEY: \${{ secrets.IA_ACCESS_KEY }}/' "$file"
              sed -i '/IA_SECRET_KEY:/s/.*/  IA_SECRET_KEY: \${{ secrets.IA_SECRET_KEY }}/' "$file"
            fi
          done

          if ! git diff --quiet; then
            git add .github/workflows/*.yml
            git commit -m "Remove hardcoded IA credentials [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
